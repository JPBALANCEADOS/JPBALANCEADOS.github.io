<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2D6A4F">
<title>Catálogo</title>
<meta property="og:title" content="Catálogo online">
<meta property="og:description" content="Mirá los productos, precios y ofertas — y consultá directo por WhatsApp.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marca:#2D6A4F;
  --marca-oscura:#1F4D38;
  --marca-pale:#E4F0EA;
  --hueso:#F6F5F1;
  --carbon:#1A1D1B;
  --carbon-60:#5B6560;
  --borde:#E5E2D9;
  --blanco:#FFFFFF;
  --rojo:#C1121F;
  --amarillo:#C89B3C;
  --radio:16px;
  --radio-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--hueso);color:var(--carbon);line-height:1.45;padding-bottom:84px;}
h1,h2,h3{font-family:'Big Shoulders',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.3px;line-height:1.05;}
button{font:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

/* ── Estados de carga / vacío / error ── */
.estado-pantalla{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 24px;text-align:center;color:var(--carbon-60);}
.estado-pantalla .glifo{font-size:34px;}
.estado-pantalla h2{font-size:20px;color:var(--carbon);text-transform:none;letter-spacing:0;}
.estado-pantalla p{font-size:14px;max-width:360px;}
.estado-pantalla .btn{margin-top:6px;padding:0 20px;height:42px;}

/* ── Skeleton (carga inicial) ── */
.skeleton-portada{height:180px;background:linear-gradient(160deg,var(--marca-oscura),var(--marca));}
.skeleton-barra{height:104px;background:#fff;border-bottom:1px solid var(--borde);}
.skeleton-grid{max-width:820px;margin:0 auto;padding:18px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:560px){ .skeleton-grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .skeleton-grid{grid-template-columns:repeat(4,1fr);} }
.skeleton-card{height:210px;border-radius:var(--radio);background:linear-gradient(100deg,#eceae3 30%,#f5f3ee 45%,#eceae3 60%);background-size:200% 100%;animation:brillo 1.4s ease-in-out infinite;}
@keyframes brillo{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── Header / portada ──
   Antes tenía altura fija (180px) con el contenido anclado abajo — si el
   nombre del comercio ocupaba 2 líneas, la primera quedaba tapada por el
   logo/recortada. Ahora la altura la define el contenido (padding +
   min-height), nunca al revés. */
header.marca{background:var(--marca);color:#fff;}
.portada{position:relative;min-height:150px;background:linear-gradient(160deg,var(--marca-oscura),var(--marca));background-size:cover;background-position:center;}
.marca-info{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 20px;max-width:820px;margin:0 auto;}
.marca-info-izq{display:flex;align-items:center;gap:14px;min-width:0;}
.marca-logo{width:60px;height:60px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.marca-logo img{width:100%;height:100%;object-fit:cover;}
.marca-logo .sin-logo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.marca-nombre{font-size:clamp(19px,5vw,30px);color:#fff;overflow-wrap:break-word;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.btn-compartir{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(2px);}
.btn-compartir:hover{background:rgba(255,255,255,.26);}

/* ── Buscador + filtros ── */
.barra-filtros{position:sticky;top:0;z-index:20;background:var(--blanco);border-bottom:1px solid var(--borde);box-shadow:0 2px 10px rgba(0,0,0,.04);}
.barra-filtros-inner{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.fila-buscador-orden{display:flex;gap:8px;}
.buscador-wrap{position:relative;flex:1;min-width:0;}
.buscador-wrap input{width:100%;height:44px;padding:0 34px 0 38px;border:1.5px solid var(--borde);border-radius:999px;font-size:.92rem;outline:none;background:var(--hueso);}
.buscador-wrap input:focus{border-color:var(--marca);background:#fff;}
.buscador-icono{position:absolute;top:50%;left:14px;transform:translateY(-50%);font-size:15px;pointer-events:none;opacity:.6;}
.buscador-limpiar{display:none;position:absolute;top:50%;right:10px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--borde);color:var(--carbon-60);font-size:12px;align-items:center;justify-content:center;}
.buscador-limpiar.visible{display:flex;}
.orden-select{flex:none;height:44px;padding:0 12px;border:1.5px solid var(--borde);border-radius:999px;background:var(--hueso);font-size:.8rem;font-weight:600;color:var(--carbon-60);max-width:132px;}
.chips-fila{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips-fila::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border:1.5px solid var(--borde);border-radius:999px;background:#fff;color:var(--carbon-60);font-size:.8rem;font-weight:600;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
.chip.activo{border-color:var(--marca);background:var(--marca);color:#fff;}
.chip .chip-count{opacity:.7;font-weight:500;}

/* ── Grid de productos ── */
.contenido{max-width:820px;margin:0 auto;padding:18px 16px 8px;}
.resultado-info{font-size:.8rem;color:var(--carbon-60);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.resultado-info .link-limpiar{color:var(--marca);font-weight:700;font-size:.78rem;flex:none;}
.grid-productos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:560px){ .grid-productos{grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .grid-productos{grid-template-columns:repeat(4,1fr);} }

.card{min-width:0;background:#fff;border-radius:var(--radio);border:1px solid var(--borde);padding:10px;position:relative;text-align:left;display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .12s ease;animation:aparecer .25s ease both;}
@keyframes aparecer{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(26,29,27,.08);}
.card-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:1;}
.badge{padding:2px 8px;border-radius:999px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:#fff;}
.badge-destacado{background:var(--amarillo);color:#2A1F04;}
.badge-oferta{background:var(--rojo);}
.card-img{height:104px;display:flex;align-items:center;justify-content:center;background:var(--hueso);border-radius:var(--radio-sm);overflow:hidden;margin-bottom:8px;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.sin-imagen{font-size:28px;opacity:.35;}
.card-marca{font-size:.62rem;text-transform:uppercase;color:var(--carbon-60);letter-spacing:.3px;overflow-wrap:anywhere;}
.card-nombre{font-size:.82rem;font-weight:700;margin:2px 0 6px;overflow-wrap:anywhere;}
.card-precio{font-size:.92rem;font-weight:800;margin-top:auto;}
.card-precio .tachado{margin-left:6px;font-size:.72rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.card-estrellas{color:var(--amarillo);font-size:.75rem;margin-top:2px;}
.card-btn-agregar{margin-top:8px;padding:7px;border-radius:var(--radio-sm);border:1.5px solid var(--marca);color:var(--marca);font-size:.72rem;font-weight:700;background:#fff;transition:background .12s,color .12s;}
.card-btn-agregar.en-lista{background:var(--marca);color:#fff;}

.vacio-grid{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--carbon-60);display:flex;flex-direction:column;align-items:center;gap:12px;}

/* ── Overlays genéricos (ficha + lista de consulta) ── */
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(20,22,20,0);align-items:flex-end;justify-content:center;transition:background .22s ease;}
.overlay.abierto{display:flex;background:rgba(20,22,20,.5);}
@media (min-width:640px){ .overlay{align-items:center;} }

.hoja{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);}
.overlay.abierto .hoja{transform:translateY(0);}
@media (min-width:640px){ .hoja{border-radius:var(--radio);max-height:88vh;transform:translateY(12px) scale(.98);opacity:0;transition:transform .2s ease, opacity .2s ease;} .overlay.abierto .hoja{transform:translateY(0) scale(1);opacity:1;} }
.hoja-agarre{width:40px;height:4px;border-radius:4px;background:var(--borde);margin:0 auto 12px;}
.hoja-cerrar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--hueso);font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;}

/* ── Ficha de producto ── */
.ficha-hero{position:relative;height:min(280px,42vh);border-radius:var(--radio);background:var(--hueso);overflow:hidden;margin-bottom:10px;}
.ficha-hero > div{width:100%;height:100%;}
.ficha-hero img{width:100%;height:100%;object-fit:contain;}
.ficha-hero .sin-imagen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;}
.ficha-hero-badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;}
.ficha-miniaturas{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scroll-snap-type:x proximity;}
.ficha-miniaturas button{flex:none;width:52px;height:52px;padding:0;border-radius:var(--radio-sm);overflow:hidden;background:var(--hueso);border:2px solid transparent;scroll-snap-align:start;opacity:.65;transition:opacity .12s,border-color .12s;}
.ficha-miniaturas button.activa{opacity:1;border-color:var(--marca);}
.ficha-miniaturas img{width:100%;height:100%;object-fit:cover;}
.scroll-desvanecido{position:relative;}
.scroll-desvanecido .ficha-relacionados{-webkit-mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 28px),transparent);}
.ficha-relacionados{display:flex;gap:10px;overflow-x:auto;margin-top:8px;padding:2px 2px 6px;scroll-snap-type:x proximity;}
.ficha-relacionado{flex:none;width:104px;text-align:left;border:1px solid var(--borde);border-radius:var(--radio-sm);padding:8px;margin:0;background:#fff;scroll-snap-align:start;transition:border-color .12s,box-shadow .12s;}
.ficha-relacionado:hover{border-color:var(--marca);box-shadow:0 6px 14px rgba(26,29,27,.08);}
.ficha-relacionado .card-img{height:72px;margin-bottom:6px;}
.ficha-relacionado .card-marca,.ficha-relacionado .card-nombre{font-size:.62rem;overflow-wrap:anywhere;}
.ficha-relacionado .card-nombre{margin-bottom:0;}
.ficha-marca{font-size:.72rem;text-transform:uppercase;color:var(--carbon-60);overflow-wrap:anywhere;}
.ficha-nombre{font-size:1.15rem;margin:2px 0 8px;overflow-wrap:anywhere;}
.ficha-precio-fila{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ficha-precio{font-size:1.4rem;font-weight:800;}
.ficha-precio.tachado{font-size:.95rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.ficha-estrellas{color:var(--amarillo);margin-bottom:14px;}
.ficha-seccion{margin-top:14px;}
.ficha-seccion h3{font-size:.7rem;color:var(--carbon-60);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.ficha-seccion p{font-size:.88rem;color:var(--carbon);white-space:pre-line;}
.ficha-relacionados{display:flex;gap:10px;overflow-x:auto;margin-top:8px;}
.ficha-relacionado{flex:none;width:96px;text-align:left;}
.ficha-relacionado .card-img{height:76px;margin-bottom:4px;}
.ficha-relacionado .card-marca,.ficha-relacionado .card-nombre{font-size:.62rem;}
.ficha-botones{display:flex;gap:8px;margin-top:18px;}
.btn{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s ease;}
.btn:active{transform:scale(.97);}
.btn-primario{background:var(--marca);color:#fff;}
.btn-fantasma{background:var(--marca-pale);color:var(--marca-oscura);}

/* ── Lista de consulta (mini modal) ── */
.lista-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);}
.lista-item .card-img{width:46px;height:46px;flex:none;margin:0;}
.lista-item-info{flex:1;min-width:0;}
.lista-item-nombre{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lista-item-precio{font-size:.76rem;color:var(--carbon-60);}
.lista-item-quitar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--hueso);color:var(--carbon-60);font-size:14px;}
.lista-item-quitar:hover{background:#ffe5e7;color:var(--rojo);}
.lista-vacia{padding:24px 0;text-align:center;color:var(--carbon-60);font-size:.85rem;}

/* ── Barra flotante de consulta (signature: no es un "carrito") ── */
.barra-consulta{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;max-width:520px;margin:0 auto;background:var(--carbon);color:#fff;border-radius:999px;padding:8px 8px 8px 4px;display:none;align-items:center;justify-content:space-between;gap:6px;box-shadow:0 14px 34px rgba(0,0,0,.25);transform:translateY(120%);transition:transform .25s cubic-bezier(.32,.72,0,1);}
.barra-consulta.visible{display:flex;transform:translateY(0);}
.barra-consulta-texto{flex:1;padding:0 8px 0 12px;font-size:.82rem;font-weight:600;text-align:left;}
.barra-consulta-texto strong{font-family:'Big Shoulders',sans-serif;font-size:1.1rem;margin-right:4px;}
.barra-consulta button{background:#fff;color:var(--carbon);border-radius:999px;height:40px;padding:0 16px;font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px;flex:none;}

.footer-nota{max-width:820px;margin:20px auto 0;padding:0 16px;font-size:.72rem;color:var(--carbon-60);text-align:center;}
</style>
</head>
<body>

<div id="raiz"></div>

<script>
// ── Config: cómo este frontend único sabe de qué cliente es el catálogo ──
//
// Modo 1 (producción): la URL pública es catalogo.jpbalanceados.com/petshopjuan
// GitHub Pages redirige eso a /?cliente=petshopjuan (ver 404.html), y acá
// le preguntamos al proyecto central "¿cuál es el catálogo de petshopjuan?"
//
// Modo 2 (prueba rápida, sin depender del directorio): pasar directamente
// ?api=<url del endpoint del cliente>, salteando la resolución por slug.
const DIRECTORIO_URL = 'https://script.google.com/macros/s/AKfycbyDDyVLAvh3HbG9S4Ot_txcKS3Uj2qhdxxiITePNICvKH8HcsfgTxwUi-8iZUM3ltDqpw/exec';

const params = new URLSearchParams(location.search);
let API_URL = params.get('api') || '';
const CLIENTE_SLUG = params.get('cliente') || '';

let CATALOGO = null;
let productosActuales = [];
let listaConsulta = new Map(); // producto_id -> producto
let filtroTexto = '';
let filtroEspecie = '';
let filtroCategoria = '';
let ordenActual = 'relevancia';
let claveAlmacenamiento = '';
let ultimoFocoAntesDeOverlay = null;

function escaparHTML(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function monto(v){ return Number(v||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function estrellasTexto(v){
  if(!v) return '';
  let s=''; for(let i=1;i<=5;i++) s += i<=v ? '★' : '☆';
  return s;
}
// Varios nombres vienen armados como "Marca/Especie/-/Etapa/-/Peso" sin
// espacio alrededor de la barra — eso además de leerse mal, al no tener
// puntos de corte, empuja el ancho de la tarjeta. Acá solo se cambia
// cómo se MUESTRA, no el dato real.
function formatearNombreProducto(nombre){
  return String(nombre||'')
    .replace(/\s*\/\s*-?\s*\/\s*/g, ' / ')  // colapsa tramos vacíos tipo "/-/"
    .replace(/\/(?!\s)/g, ' / ')
    .replace(/\s+/g, ' ')
    .trim();
}
function imagenConFallback(url, alt, claseExtra){
  if(!url) return '<span class="sin-imagen'+(claseExtra?(' '+claseExtra):'')+'">🐾</span>';
  return '<img src="'+escaparHTML(url)+'" alt="'+escaparHTML(alt)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'sin-imagen\',textContent:\'🐾\'}))">';
}

function pintarEstado(glifo, titulo, texto, mostrarReintentar){
  document.getElementById('raiz').innerHTML =
    '<div class="estado-pantalla"><div class="glifo">'+glifo+'</div>'+
    '<h2>'+escaparHTML(titulo)+'</h2><p>'+escaparHTML(texto)+'</p>'+
    (mostrarReintentar ? '<button class="btn btn-primario" onclick="location.reload()">Reintentar</button>' : '')+
    '</div>';
}

function pintarSkeleton(){
  document.getElementById('raiz').innerHTML =
    '<div class="skeleton-portada"></div><div class="skeleton-barra"></div>'+
    '<div class="skeleton-grid">'+Array(8).fill('<div class="skeleton-card"></div>').join('')+'</div>';
}

// ── Persistencia de la lista de consulta (localStorage, por catálogo) ──
function cargarListaGuardada(){
  if(!claveAlmacenamiento) return;
  try{
    const raw = localStorage.getItem(claveAlmacenamiento);
    if(!raw) return;
    const ids = JSON.parse(raw);
    (ids||[]).forEach(function(id){
      const p = CATALOGO.productos.find(function(x){ return x.producto_id===id; });
      if(p) listaConsulta.set(id, p);
    });
  }catch(e){ /* si está corrupto, arrancamos con la lista vacía */ }
}
function guardarListaEnStorage(){
  if(!claveAlmacenamiento) return;
  try{ localStorage.setItem(claveAlmacenamiento, JSON.stringify(Array.from(listaConsulta.keys()))); }catch(e){}
}

async function iniciar(){
  if(!API_URL && !CLIENTE_SLUG){
    pintarEstado('🔗','Falta identificar el comercio','Esta página necesita saber de qué comercio es el catálogo (parámetro cliente o api en la dirección).');
    return;
  }
  pintarSkeleton();

  if(!API_URL){
    try{
      const resDirectorio = await fetch(DIRECTORIO_URL + '?catalogo_de=' + encodeURIComponent(CLIENTE_SLUG), { cache: 'no-store' });
      const jsonDirectorio = await resDirectorio.json();
      if(!jsonDirectorio || !jsonDirectorio.success){
        pintarEstado('📭','No encontramos ese catálogo', (jsonDirectorio && jsonDirectorio.error) || 'Revisá el enlace e intentá de nuevo.', true);
        return;
      }
      API_URL = jsonDirectorio.api_url;
    }catch(e){
      pintarEstado('⚠️','No se pudo identificar el comercio','Revisá tu conexión e intentá de nuevo en unos minutos.', true);
      return;
    }
  }

  try{
    const res = await fetch(API_URL, { cache: 'no-store' });
    const json = await res.json();
    if(!json || !json.success){
      pintarEstado('📭','Este catálogo todavía no está disponible', (json && json.error) || 'Volvé a intentarlo más tarde.', true);
      return;
    }
    CATALOGO = json.data;
    claveAlmacenamiento = 'lista_consulta:' + API_URL;
    cargarListaGuardada();
    renderPagina();
  }catch(e){
    pintarEstado('⚠️','No se pudo cargar el catálogo','Revisá tu conexión e intentá de nuevo en unos minutos.', true);
  }
}

function especiesUnicas(){
  const set = new Map();
  CATALOGO.productos.forEach(function(p){
    if(p.especie_id) set.set(String(p.especie_id), p.especie_nombre || ('Especie '+p.especie_id));
  });
  return set;
}
function categoriasUnicas(){
  const set = new Map();
  CATALOGO.productos.forEach(function(p){
    if(p.categoria_id) set.set(String(p.categoria_id), p.categoria_nombre || ('Categoría '+p.categoria_id));
  });
  return set;
}
function contarPor(campo, valor){
  return CATALOGO.productos.filter(function(p){ return String(p[campo]||'')===String(valor); }).length;
}

function renderPagina(){
  const negocio = CATALOGO.negocio || {};
  const colorMarca = negocio.color_marca || '#2D6A4F';
  document.documentElement.style.setProperty('--marca', colorMarca);
  const tituloPagina = negocio.nombre_comercio ? (negocio.nombre_comercio + ' — Catálogo') : 'Catálogo';
  document.title = tituloPagina;

  const especies = especiesUnicas();
  const categorias = categoriasUnicas();

  const chipsEspecie = ['<div class="chip activo" data-tipo="especie" data-val="">Todas</div>']
    .concat(Array.from(especies.entries()).map(function(par){
      return '<div class="chip" data-tipo="especie" data-val="'+escaparHTML(par[0])+'">'+escaparHTML(par[1])+' <span class="chip-count">('+contarPor('especie_id',par[0])+')</span></div>';
    })).join('');

  const chipsCategoria = ['<div class="chip activo" data-tipo="categoria" data-val="">Todas</div>']
    .concat(Array.from(categorias.entries()).map(function(par){
      return '<div class="chip" data-tipo="categoria" data-val="'+escaparHTML(par[0])+'">'+escaparHTML(par[1])+' <span class="chip-count">('+contarPor('categoria_id',par[0])+')</span></div>';
    })).join('');

  document.getElementById('raiz').innerHTML =
    '<header class="marca">'+
      '<div class="portada" style="'+(negocio.portada_url ? 'background-image:linear-gradient(180deg, rgba(15,20,18,.25), rgba(15,20,18,.55)), url(\''+escaparHTML(negocio.portada_url).replace(/'/g,"%27")+'\')' : '')+'">'+
        '<div class="marca-info">'+
          '<div class="marca-info-izq">'+
            '<div class="marca-logo">'+(negocio.logo_url ? '<img src="'+escaparHTML(negocio.logo_url)+'" alt="">' : '<span class="sin-logo">🐾</span>')+'</div>'+
            '<h1 class="marca-nombre">'+escaparHTML(negocio.nombre_comercio || 'Catálogo')+'</h1>'+
          '</div>'+
          '<button class="btn-compartir" id="btnCompartirCatalogo" title="Compartir catálogo" aria-label="Compartir catálogo">🔗</button>'+
        '</div>'+
      '</div>'+
    '</header>'+
    '<div class="barra-filtros"><div class="barra-filtros-inner">'+
      '<div class="fila-buscador-orden">'+
        '<div class="buscador-wrap"><span class="buscador-icono">🔍</span>'+
          '<input id="buscador" type="text" placeholder="Buscar producto, marca..." aria-label="Buscar producto o marca">'+
          '<button class="buscador-limpiar" id="btnLimpiarBuscador" aria-label="Limpiar búsqueda">✕</button>'+
        '</div>'+
        '<select id="ordenSelect" class="orden-select" aria-label="Ordenar por">'+
          '<option value="relevancia">Relevancia</option>'+
          '<option value="precio_asc">Precio ↑</option>'+
          '<option value="precio_desc">Precio ↓</option>'+
          '<option value="mejor_valorados">Mejor valorados</option>'+
        '</select>'+
      '</div>'+
      '<div id="chipsEspecie" class="chips-fila">'+chipsEspecie+'</div>'+
      '<div id="chipsCategoria" class="chips-fila">'+chipsCategoria+'</div>'+
    '</div></div>'+
    '<main class="contenido">'+
      '<div id="resultadoInfo" class="resultado-info"></div>'+
      '<div id="grid" class="grid-productos"></div>'+
    '</main>'+
    '<p class="footer-nota">Catálogo actualizado el '+
      new Date(CATALOGO.fecha_publicacion).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+
      ' · Los precios pueden variar sin previo aviso.</p>'+
    '<div id="barraConsulta" class="barra-consulta">'+
      '<button id="btnVerLista" class="barra-consulta-texto" style="background:none;color:#fff;text-align:left"><strong id="contadorConsulta">0</strong> en tu lista — ver</button>'+
      '<button id="btnEnviarConsulta">🐾 Enviar consulta</button>'+
    '</div>'+
    '<div id="overlayFicha" class="overlay">'+
      '<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="fichaTituloAria">'+
        '<button class="hoja-cerrar" id="btnCerrarFicha" aria-label="Cerrar">✕</button>'+
        '<div class="hoja-agarre"></div>'+
        '<div id="fichaContenido"></div>'+
      '</div>'+
    '</div>'+
    '<div id="overlayLista" class="overlay">'+
      '<div class="hoja" role="dialog" aria-modal="true">'+
        '<button class="hoja-cerrar" id="btnCerrarLista" aria-label="Cerrar">✕</button>'+
        '<div class="hoja-agarre"></div>'+
        '<h2 style="font-size:1.05rem;margin-bottom:10px">Tu lista de consulta</h2>'+
        '<div id="listaContenido"></div>'+
        '<div class="ficha-botones">'+
          '<button class="btn btn-primario" id="btnEnviarDesdeLista">Enviar consulta por WhatsApp</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  const buscadorInput = document.getElementById('buscador');
  buscadorInput.addEventListener('input', function(){
    filtroTexto = this.value.trim().toLowerCase();
    document.getElementById('btnLimpiarBuscador').classList.toggle('visible', !!this.value);
    aplicarFiltros();
  });
  document.getElementById('btnLimpiarBuscador').addEventListener('click', function(){
    buscadorInput.value = ''; filtroTexto = ''; this.classList.remove('visible');
    buscadorInput.focus();
    aplicarFiltros();
  });
  document.getElementById('ordenSelect').addEventListener('change', function(){
    ordenActual = this.value;
    aplicarFiltros();
  });
  document.getElementById('chipsEspecie').addEventListener('click', function(e){
    const chip = e.target.closest('.chip'); if(!chip) return;
    filtroEspecie = chip.dataset.val;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('activo', c===chip); });
    aplicarFiltros();
  });
  document.getElementById('chipsCategoria').addEventListener('click', function(e){
    const chip = e.target.closest('.chip'); if(!chip) return;
    filtroCategoria = chip.dataset.val;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('activo', c===chip); });
    aplicarFiltros();
  });
  document.getElementById('btnCerrarFicha').addEventListener('click', cerrarFicha);
  document.getElementById('overlayFicha').addEventListener('click', function(e){ if(e.target===this) cerrarFicha(); });
  document.getElementById('btnEnviarConsulta').addEventListener('click', function(){ enviarConsultaWhatsapp(); });
  document.getElementById('btnVerLista').addEventListener('click', abrirLista);
  document.getElementById('btnCerrarLista').addEventListener('click', cerrarLista);
  document.getElementById('overlayLista').addEventListener('click', function(e){ if(e.target===this) cerrarLista(); });
  document.getElementById('btnEnviarDesdeLista').addEventListener('click', function(){ enviarConsultaWhatsapp(); });

  const btnCompartir = document.getElementById('btnCompartirCatalogo');
  btnCompartir.addEventListener('click', function(){
    const datosCompartir = { title: tituloPagina, text: 'Mirá el catálogo de ' + (negocio.nombre_comercio||'este comercio'), url: location.href };
    if(navigator.share){ navigator.share(datosCompartir).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(function(){ alert('Enlace copiado.'); }); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(document.getElementById('overlayFicha').classList.contains('abierto')) cerrarFicha();
    else if(document.getElementById('overlayLista').classList.contains('abierto')) cerrarLista();
  });

  renderBarraConsulta();
  aplicarFiltros();
}

function aplicarFiltros(){
  let lista = CATALOGO.productos.slice();
  if(filtroEspecie) lista = lista.filter(function(p){ return String(p.especie_id||'')===filtroEspecie; });
  if(filtroCategoria) lista = lista.filter(function(p){ return String(p.categoria_id||'')===filtroCategoria; });
  if(filtroTexto){
    lista = lista.filter(function(p){
      const hay = [p.nombre,p.marca_nombre,p.sku].join(' ').toLowerCase();
      return hay.indexOf(filtroTexto) !== -1;
    });
  }

  if(ordenActual === 'precio_asc'){
    lista.sort(function(a,b){ return precioEfectivo(a)-precioEfectivo(b); });
  } else if(ordenActual === 'precio_desc'){
    lista.sort(function(a,b){ return precioEfectivo(b)-precioEfectivo(a); });
  } else if(ordenActual === 'mejor_valorados'){
    lista.sort(function(a,b){ return (b.estrella||0)-(a.estrella||0); });
  } else {
    lista.sort(function(a,b){
      if(!!b.destacado !== !!a.destacado) return b.destacado ? 1 : -1;
      return (b.estrella||0)-(a.estrella||0);
    });
  }

  productosActuales = lista;
  const hayFiltrosActivos = !!(filtroTexto || filtroEspecie || filtroCategoria);
  document.getElementById('resultadoInfo').innerHTML =
    '<span>'+lista.length+(lista.length===1?' producto encontrado':' productos encontrados')+'</span>'+
    (hayFiltrosActivos ? '<button class="link-limpiar" onclick="limpiarTodosLosFiltros()">Limpiar filtros</button>' : '');
  renderGrid();
}

function precioEfectivo(p){ return (p.oferta && p.precio_oferta) ? p.precio_oferta : p.precio; }

function limpiarTodosLosFiltros(){
  filtroTexto=''; filtroEspecie=''; filtroCategoria='';
  document.getElementById('buscador').value='';
  document.getElementById('btnLimpiarBuscador').classList.remove('visible');
  document.querySelectorAll('#chipsEspecie .chip, #chipsCategoria .chip').forEach(function(c){ c.classList.toggle('activo', c.dataset.val===''); });
  aplicarFiltros();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if(!productosActuales.length){
    grid.innerHTML = '<div class="vacio-grid"><span style="font-size:28px">🐾</span>'+
      '<span>No encontramos productos con esos filtros. Probá con otra búsqueda.</span>'+
      '<button class="btn btn-fantasma" style="flex:none;padding:0 18px" onclick="limpiarTodosLosFiltros()">Limpiar filtros</button>'+
    '</div>';
    return;
  }
  grid.innerHTML = productosActuales.map(function(p){
    const enLista = listaConsulta.has(p.producto_id);
    let precioHtml = '$'+monto(p.precio);
    if(p.oferta && p.precio_oferta){
      precioHtml = '$'+monto(p.precio_oferta)+'<span class="tachado">$'+monto(p.precio)+'</span>';
    }
    return '<article class="card" data-id="'+escaparHTML(p.producto_id)+'">'+
      '<div class="card-badges">'+
        (p.destacado ? '<span class="badge badge-destacado">★ Destacado</span>' : '')+
        (p.oferta ? '<span class="badge badge-oferta">Oferta</span>' : '')+
      '</div>'+
      '<button class="card-abrir" data-id="'+escaparHTML(p.producto_id)+'" style="all:unset;cursor:pointer;display:block;">'+
        '<div class="card-img">'+imagenConFallback(p.imagen_url, p.nombre)+'</div>'+
        '<div class="card-marca">'+escaparHTML(p.marca_nombre)+'</div>'+
        '<div class="card-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</div>'+
        (p.estrella ? '<div class="card-estrellas">'+estrellasTexto(p.estrella)+'</div>' : '')+
        '<div class="card-precio">'+precioHtml+'</div>'+
      '</button>'+
      '<button class="card-btn-agregar'+(enLista?' en-lista':'')+'" data-id="'+escaparHTML(p.producto_id)+'">'+
        (enLista ? '✓ En tu lista' : '+ Agregar a la lista')+
      '</button>'+
    '</article>';
  }).join('');
}

document.getElementById('raiz').addEventListener('click', function(e){
  const btnAbrir = e.target.closest('.card-abrir');
  if(btnAbrir){ abrirFicha(btnAbrir.dataset.id); return; }
  const btnAgregar = e.target.closest('.card-btn-agregar');
  if(btnAgregar){ toggleConsulta(btnAgregar.dataset.id); return; }
});

function toggleConsulta(id){
  const producto = CATALOGO.productos.find(function(p){ return p.producto_id===id; });
  if(!producto) return;
  if(listaConsulta.has(id)) listaConsulta.delete(id); else listaConsulta.set(id, producto);
  guardarListaEnStorage();
  renderGrid();
  renderBarraConsulta();
  const btnFicha = document.getElementById('btnFichaAgregar');
  if(btnFicha && btnFicha.dataset.id === id){
    btnFicha.textContent = listaConsulta.has(id) ? '✓ En tu lista' : '+ Agregar a mi lista';
  }
  if(document.getElementById('overlayLista').classList.contains('abierto')) renderListaContenido();
}

function renderBarraConsulta(){
  const barra = document.getElementById('barraConsulta');
  const cantidad = listaConsulta.size;
  document.getElementById('contadorConsulta').textContent = cantidad;
  barra.classList.toggle('visible', cantidad>0);
}

function productosRelacionados(p){
  return CATALOGO.productos.filter(function(x){
    return x.producto_id !== p.producto_id && (
      (p.especie_id && x.especie_id===p.especie_id && x.categoria_id===p.categoria_id)
    );
  }).slice(0,6);
}

function abrirFicha(id){
  const p = CATALOGO.productos.find(function(x){ return x.producto_id===id; });
  if(!p) return;
  const galeria = [p.imagen_url].concat(p.galeria_imagenes||[]).filter(Boolean);
  const enLista = listaConsulta.has(id);
  const relacionados = productosRelacionados(p);

  let precioHtml = '<span class="ficha-precio">$'+monto(p.precio)+'</span>';
  if(p.oferta && p.precio_oferta){
    precioHtml = '<span class="ficha-precio">$'+monto(p.precio_oferta)+'</span><span class="ficha-precio tachado">$'+monto(p.precio)+'</span>';
  }

  const badgesHero = (p.destacado ? '<span class="badge badge-destacado">★ Destacado</span>' : '') +
    (p.oferta ? '<span class="badge badge-oferta">Oferta</span>' : '');

  const heroHtml =
    '<div class="ficha-hero">'+
      (badgesHero ? '<div class="ficha-hero-badges">'+badgesHero+'</div>' : '')+
      '<div id="fichaHeroImg">'+imagenConFallback(galeria[0], p.nombre)+'</div>'+
    '</div>'+
    (galeria.length > 1 ? '<div class="ficha-miniaturas">'+
      galeria.map(function(url, i){
        return '<button data-idx="'+i+'" data-url="'+escaparHTML(url)+'" class="'+(i===0?'activa':'')+'" aria-label="Ver imagen '+(i+1)+'">'+imagenConFallback(url, p.nombre)+'</button>';
      }).join('')+'</div>' : '');

  document.getElementById('fichaContenido').innerHTML =
    heroHtml+
    '<div class="ficha-marca">'+escaparHTML(p.marca_nombre)+'</div>'+
    '<h2 id="fichaTituloAria" class="ficha-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</h2>'+
    '<div class="ficha-precio-fila">'+precioHtml+'</div>'+
    (p.estrella ? '<div class="ficha-estrellas">'+estrellasTexto(p.estrella)+'</div>' : '')+
    (p.descripcion ? '<div class="ficha-seccion"><h3>Descripción</h3><p>'+escaparHTML(p.descripcion)+'</p></div>' : '')+
    (p.ingredientes ? '<div class="ficha-seccion"><h3>Ingredientes</h3><p>'+escaparHTML(p.ingredientes)+'</p></div>' : '')+
    (p.info_nutricional ? '<div class="ficha-seccion"><h3>Información nutricional</h3><p>'+escaparHTML(p.info_nutricional)+'</p></div>' : '')+
    (relacionados.length ? '<div class="ficha-seccion"><h3>Productos relacionados</h3><div class="scroll-desvanecido"><div class="ficha-relacionados">'+
      relacionados.map(function(r){
        return '<button class="ficha-relacionado card-abrir" data-id="'+escaparHTML(r.producto_id)+'">'+
          '<div class="card-img">'+imagenConFallback(r.imagen_url, r.nombre)+'</div>'+
          '<div class="card-marca">'+escaparHTML(r.marca_nombre)+'</div>'+
          '<div class="card-nombre">'+escaparHTML(formatearNombreProducto(r.nombre))+'</div>'+
        '</button>';
      }).join('')+'</div></div></div>' : '')+
    '<div class="ficha-botones">'+
      '<button class="btn btn-fantasma" id="btnFichaAgregar" data-id="'+escaparHTML(id)+'">'+(enLista?'✓ En tu lista':'+ Agregar a mi lista')+'</button>'+
      '<button class="btn btn-primario" id="btnFichaWhatsapp">Consultar por WhatsApp</button>'+
    '</div>';

  document.getElementById('fichaContenido').querySelectorAll('.ficha-miniaturas button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('fichaHeroImg').innerHTML = imagenConFallback(btn.dataset.url, p.nombre);
      document.querySelectorAll('.ficha-miniaturas button').forEach(function(b){ b.classList.toggle('activa', b===btn); });
    });
  });

  document.getElementById('btnFichaAgregar').addEventListener('click', function(){ toggleConsulta(id); });
  document.getElementById('btnFichaWhatsapp').addEventListener('click', function(){ enviarConsultaWhatsapp([p]); });
  document.getElementById('fichaContenido').querySelectorAll('.ficha-relacionado').forEach(function(btn){
    btn.addEventListener('click', function(){ abrirFicha(btn.dataset.id); });
  });

  ultimoFocoAntesDeOverlay = document.activeElement;
  document.getElementById('overlayFicha').classList.add('abierto');
  document.getElementById('btnCerrarFicha').focus();
}

function cerrarFicha(){
  document.getElementById('overlayFicha').classList.remove('abierto');
  if(ultimoFocoAntesDeOverlay) ultimoFocoAntesDeOverlay.focus();
}

function abrirLista(){
  renderListaContenido();
  ultimoFocoAntesDeOverlay = document.activeElement;
  document.getElementById('overlayLista').classList.add('abierto');
  document.getElementById('btnCerrarLista').focus();
}
function cerrarLista(){
  document.getElementById('overlayLista').classList.remove('abierto');
  if(ultimoFocoAntesDeOverlay) ultimoFocoAntesDeOverlay.focus();
}

function renderListaContenido(){
  const cont = document.getElementById('listaContenido');
  const productos = Array.from(listaConsulta.values());
  if(!productos.length){
    cont.innerHTML = '<div class="lista-vacia">Todavía no agregaste productos.</div>';
    return;
  }
  cont.innerHTML = productos.map(function(p){
    return '<div class="lista-item" data-id="'+escaparHTML(p.producto_id)+'">'+
      '<div class="card-img">'+imagenConFallback(p.imagen_url, p.nombre)+'</div>'+
      '<div class="lista-item-info">'+
        '<div class="lista-item-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</div>'+
        '<div class="lista-item-precio">$'+monto(precioEfectivo(p))+'</div>'+
      '</div>'+
      '<button class="lista-item-quitar" data-id="'+escaparHTML(p.producto_id)+'" aria-label="Quitar">✕</button>'+
    '</div>';
  }).join('');
  cont.querySelectorAll('.lista-item-quitar').forEach(function(btn){
    btn.addEventListener('click', function(){ toggleConsulta(btn.dataset.id); });
  });
}

function enviarConsultaWhatsapp(productosForzados){
  const productos = productosForzados || Array.from(listaConsulta.values());
  if(!productos.length){ alert('Agregá al menos un producto a tu lista.'); return; }

  const negocio = (CATALOGO && CATALOGO.negocio) || {};
  const numero = String(negocio.whatsapp_numero || '').replace(/[^\d]/g,'');

  const lineas = productos.map(function(p){ return '- '+formatearNombreProducto(p.nombre) + (p.marca_nombre ? ' ('+p.marca_nombre+')' : ''); });
  const texto = 'Hola. Estoy interesado en los siguientes productos:\n\n'+lineas.join('\n')+'\n\nEspero su respuesta.';

  const url = (numero ? 'https://wa.me/'+numero : 'https://wa.me/') + '?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}

iniciar();
