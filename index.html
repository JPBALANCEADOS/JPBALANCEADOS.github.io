<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2D6A4F">
<title>Catálogo</title>
<meta property="og:title" content="Catálogo online">
<meta property="og:description" content="Mirá los productos, precios y ofertas — y consultá directo por WhatsApp.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marca:#2D6A4F;
  --marca-oscura:#1F4D38;
  --marca-pale:#E4F0EA;
  --hueso:#F6F5F1;
  --carbon:#1A1D1B;
  --carbon-60:#5B6560;
  --borde:#E5E2D9;
  --blanco:#FFFFFF;
  --rojo:#C1121F;
  --amarillo:#C89B3C;
  --radio:16px;
  --radio-sm:10px;
  --sombra-sm:0 2px 8px rgba(26,29,27,.06);
  --sombra-md:0 10px 24px rgba(26,29,27,.09);
  --sombra-lg:0 14px 34px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--hueso);color:var(--carbon);line-height:1.45;padding-bottom:84px;}
h1,h2,h3{font-family:'Big Shoulders',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.3px;line-height:1.05;}
button{font:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
.icono{display:inline-flex;flex:none;}
.icono svg{display:block;}

/* ── Estados de carga / vacío / error ── */
.estado-pantalla{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 24px;text-align:center;color:var(--carbon-60);}
.estado-pantalla .glifo{color:var(--carbon-60);}
.estado-pantalla h2{font-size:20px;color:var(--carbon);text-transform:none;letter-spacing:0;}
.estado-pantalla p{font-size:14px;max-width:360px;}
.estado-pantalla .btn{margin-top:6px;padding:0 20px;height:42px;}

/* ── Pantalla de carga inicial: simple, blanca, con spinner y texto ── */
.pantalla-carga{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;color:var(--carbon-60);font-size:.95rem;font-weight:600;}
.spinner{width:22px;height:22px;border:3px solid var(--borde);border-top-color:var(--marca);border-radius:50%;animation:girar-spinner .7s linear infinite;}
.spinner-grande{width:38px;height:38px;border-width:4px;}
.spinner-imagen{position:absolute;inset:0;margin:auto;width:18px;height:18px;border-width:2.5px;z-index:2;}
@keyframes girar-spinner{to{transform:rotate(360deg);}}

/* ── Header / portada ── */
header.marca{background:var(--marca);color:#fff;}
.portada{position:relative;min-height:150px;background:linear-gradient(160deg,var(--marca-oscura),var(--marca));background-size:cover;background-position:center;}
.marca-info{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 20px;max-width:820px;margin:0 auto;}
.marca-info-izq{display:flex;align-items:center;gap:14px;min-width:0;}
.marca-logo{width:60px;height:60px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:var(--sombra-md);}
.marca-logo img{width:100%;height:100%;object-fit:cover;}
.marca-logo .sin-logo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--marca);}
.marca-nombre{font-size:clamp(19px,5vw,30px);color:#fff;overflow-wrap:break-word;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.35);}
.marca-acciones{display:flex;gap:8px;flex:none;}
.btn-header-icono{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.btn-header-icono:hover{background:rgba(255,255,255,.28);}
.btn-header-whatsapp{width:auto;padding:0 16px;gap:7px;background:#fff;color:var(--marca-oscura);font-size:.8rem;font-weight:700;}
.btn-header-whatsapp:hover{background:#fff;opacity:.9;}
.btn-header-whatsapp span.texto-wa{display:none;}
@media (min-width:480px){ .btn-header-whatsapp{width:auto;} .btn-header-whatsapp span.texto-wa{display:inline;} }

/* ── Franja de beneficios ── */
.beneficios{background:#fff;border-bottom:1px solid var(--borde);}
.beneficios-inner{max-width:820px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;}
@media (min-width:640px){ .beneficios-inner{grid-template-columns:repeat(4,1fr);} }
.beneficio-item{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;color:var(--carbon-60);}
.beneficio-item .icono{color:var(--marca);}

/* ── Buscador + filtros ── */
.barra-filtros{position:sticky;top:0;z-index:20;background:var(--blanco);border-bottom:1px solid var(--borde);box-shadow:var(--sombra-sm);}
.barra-filtros-inner{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.fila-buscador-orden{display:flex;gap:8px;}
.buscador-wrap{position:relative;flex:1;min-width:0;}
.buscador-wrap input{width:100%;height:44px;padding:0 34px 0 38px;border:1.5px solid var(--borde);border-radius:999px;font-size:.92rem;outline:none;background:var(--hueso);}
.buscador-wrap input:focus{border-color:var(--marca);background:#fff;}
.buscador-icono{position:absolute;top:50%;left:14px;transform:translateY(-50%);color:var(--carbon-60);pointer-events:none;}
.buscador-limpiar{display:none;position:absolute;top:50%;right:10px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--borde);color:var(--carbon-60);font-size:12px;align-items:center;justify-content:center;}
.buscador-limpiar.visible{display:flex;}
.orden-select{flex:none;height:44px;padding:0 12px;border:1.5px solid var(--borde);border-radius:999px;background:var(--hueso);font-size:.8rem;font-weight:600;color:var(--carbon-60);max-width:132px;}
.chips-fila{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips-fila::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border:1.5px solid var(--borde);border-radius:999px;background:#fff;color:var(--carbon-60);font-size:.8rem;font-weight:600;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;}
.chip:not(.activo):hover{border-color:var(--marca);color:var(--marca);}
.chip.activo{border-color:var(--marca);background:var(--marca);color:#fff;}
.chip.chip-destacado{margin-left:auto;}
.chip.chip-destacado.activo{border-color:var(--amarillo);background:var(--amarillo);color:#2A1F04;}
.chip .chip-count{opacity:.7;font-weight:500;}
.card-etiquetas{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.etiqueta{padding:2px 7px;border-radius:999px;background:var(--hueso);color:var(--carbon-60);font-size:.62rem;font-weight:600;white-space:nowrap;}

/* ── Grid de productos ── */
.contenido{max-width:820px;margin:0 auto;padding:20px 16px 10px;}
.resultado-info{font-size:.8rem;color:var(--carbon-60);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.resultado-info .link-limpiar{color:var(--marca);font-weight:700;font-size:.78rem;flex:none;}
.grid-productos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (min-width:560px){ .grid-productos{grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .grid-productos{grid-template-columns:repeat(4,1fr);} }

/* La tarjeta: imagen = 60-70% del alto, resto = info. Fondo blanco liso,
   sin sombras/gradientes en la imagen — el producto es el protagonista. */
.card{min-width:0;background:#fff;border-radius:var(--radio);border:1px solid var(--borde);padding:10px;position:relative;text-align:left;display:flex;flex-direction:column;transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;animation:aparecer .25s ease both;}
@keyframes aparecer{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card:hover{transform:translateY(-3px);box-shadow:var(--sombra-md);border-color:#d8d4c8;}
.card-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:1;}
.badge{padding:2px 8px;border-radius:999px;font-size:.6rem;font-weight:800;text-transform:uppercase;color:#fff;}
.badge-oferta{background:var(--rojo);font-size:.66rem;padding:4px 10px;}
.badge-destacado{background:var(--amarillo);color:#2A1F04;}
.card-img{position:relative;aspect-ratio:1/1;width:100%;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:var(--radio-sm);overflow:hidden;margin-bottom:8px;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.sin-imagen{color:var(--carbon-60);opacity:.3;}
.card-abrir{display:flex;flex-direction:column;flex:1;width:100%;text-align:left;border:none;background:none;padding:0;margin:0;font:inherit;cursor:pointer;}
.card-marca{font-size:.62rem;text-transform:uppercase;color:var(--carbon-60);letter-spacing:.3px;overflow-wrap:anywhere;}
.card-nombre{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:.82rem;font-weight:700;line-height:1.25;margin:2px 0 6px;overflow-wrap:anywhere;}
.card-precio{font-size:.92rem;font-weight:800;margin-top:auto;padding-top:6px;}
.card-precio .precio-oferta{color:var(--rojo);}
.card-precio .tachado{margin-left:6px;font-size:.72rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.card-estrellas{color:var(--amarillo);font-size:.75rem;margin-top:2px;}
.card-btn-agregar{margin-top:8px;padding:7px;border-radius:var(--radio-sm);border:1.5px solid var(--marca);color:var(--marca);font-size:.72rem;font-weight:700;background:#fff;transition:background .12s,color .12s;}
.card-btn-agregar:hover{background:var(--marca-pale);}
.card-btn-agregar.en-lista{background:var(--marca);color:#fff;}
.card-btn-agregar.en-lista:hover{background:var(--marca-oscura);}

.vacio-grid{grid-column:1/-1;padding:48px 20px;text-align:center;color:var(--carbon-60);display:flex;flex-direction:column;align-items:center;gap:12px;}
.vacio-grid .icono{color:var(--carbon-60);opacity:.35;}

/* ── Overlays genéricos (ficha + lista de consulta) ── */
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(20,22,20,0);align-items:flex-end;justify-content:center;transition:background .22s ease;}
.overlay.abierto{display:flex;background:rgba(20,22,20,.5);}
@media (min-width:640px){ .overlay{align-items:center;} }

.hoja{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);}
.overlay.abierto .hoja{transform:translateY(0);}
@media (min-width:640px){ .hoja{border-radius:var(--radio);max-height:88vh;box-shadow:0 24px 60px rgba(0,0,0,.25);transform:translateY(12px) scale(.98);opacity:0;transition:transform .2s ease, opacity .2s ease;} .overlay.abierto .hoja{transform:translateY(0) scale(1);opacity:1;} }
.ficha-cuerpo{display:block;}
.hoja-agarre{width:40px;height:4px;border-radius:4px;background:var(--borde);margin:0 auto 12px;}
.hoja-cerrar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--hueso);font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .12s;}
.hoja-cerrar:hover{background:var(--borde);}

/* ── Ficha de producto: sin blur, sin degradados — la imagen sola, grande ── */
.ficha-hero{position:relative;height:min(320px,46vh);border-radius:var(--radio);background:#fff;border:1px solid var(--borde);overflow:hidden;margin-bottom:10px;}
#fichaHeroImg{position:relative;width:100%;height:100%;z-index:1;}
.ficha-hero-img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;}
.ficha-hero .sin-imagen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.ficha-hero .sin-imagen svg{width:64px;height:64px;}
.ficha-hero-badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;}
.ficha-miniaturas{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scroll-snap-type:x proximity;}
.ficha-miniaturas button{position:relative;flex:none;width:52px;height:52px;padding:0;border-radius:var(--radio-sm);overflow:hidden;background:#fff;border:2px solid var(--borde);scroll-snap-align:start;opacity:.65;transition:opacity .12s,border-color .12s;}
.ficha-miniaturas button.activa{opacity:1;border-color:var(--marca);}
.ficha-miniaturas img{width:100%;height:100%;object-fit:contain;}

/* Desktop: dos columnas — imagen fija a la izquierda, info a la derecha.
   Va DESPUÉS de las reglas base de .ficha-hero para poder pisarlas
   (misma especificidad — si quedara antes en el archivo, la regla base
   la pisaría a ella en vez de al revés). */
@media (min-width:860px){
  .hoja-ficha{max-width:900px;}
  .ficha-cuerpo{display:grid;grid-template-columns:360px 1fr;gap:26px;align-items:start;}
  .ficha-media{position:sticky;top:0;}
  .ficha-hero{height:380px;margin-bottom:8px;}
}

.ficha-marca{font-size:.72rem;text-transform:uppercase;color:var(--carbon-60);overflow-wrap:anywhere;}
.ficha-nombre{font-size:1.15rem;margin:2px 0 8px;overflow-wrap:anywhere;}
.ficha-estrellas{color:var(--amarillo);margin-bottom:10px;}
.ficha-precio-fila{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ficha-precio{font-size:1.4rem;font-weight:800;}
.ficha-precio.precio-oferta{color:var(--rojo);}
.ficha-precio.tachado{font-size:.95rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.ficha-botones{display:flex;gap:8px;margin:14px 0 4px;}
.btn{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s ease, box-shadow .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primario{background:var(--marca);color:#fff;}
.btn-primario:hover{box-shadow:var(--sombra-md);}
.btn-fantasma{background:var(--marca-pale);color:var(--marca-oscura);}
.ficha-seccion{margin-top:16px;}
.ficha-seccion h3{font-size:.7rem;color:var(--carbon-60);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.ficha-seccion p{font-size:.88rem;color:var(--carbon);white-space:pre-line;}

/* "También te puede interesar" — mismas tarjetas que la grilla principal,
   en una fila que se scrollea horizontalmente. */
.scroll-desvanecido{position:relative;}
.scroll-desvanecido .relacionados-fila{-webkit-mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 28px),transparent);}
.relacionados-fila{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;}
.relacionados-fila .card{flex:none;width:168px;scroll-snap-align:start;}

/* ── Lista de consulta (mini modal) ── */
.lista-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);}
.lista-item .card-img{width:46px;height:46px;flex:none;margin:0;aspect-ratio:auto;}
.lista-item .card-img .sin-imagen svg{width:20px;height:20px;}
.lista-item-info{flex:1;min-width:0;}
.lista-item-nombre{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lista-item-precio{font-size:.76rem;color:var(--carbon-60);}
.lista-item-quitar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--hueso);color:var(--carbon-60);font-size:14px;transition:background .12s,color .12s;}
.lista-item-quitar:hover{background:#ffe5e7;color:var(--rojo);}
.lista-vacia{padding:24px 0;text-align:center;color:var(--carbon-60);font-size:.85rem;}

/* ── Barra flotante de consulta (signature: no es un "carrito") ── */
.barra-consulta{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;max-width:520px;margin:0 auto;background:var(--carbon);color:#fff;border-radius:999px;padding:8px 8px 8px 4px;display:none;align-items:center;justify-content:space-between;gap:6px;box-shadow:var(--sombra-lg);transform:translateY(120%);transition:transform .25s cubic-bezier(.32,.72,0,1);}
.barra-consulta.visible{display:flex;transform:translateY(0);}
.barra-consulta-texto{flex:1;padding:0 8px 0 12px;font-size:.82rem;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;}
.barra-consulta-texto strong{font-family:'Big Shoulders',sans-serif;font-size:1.1rem;}
.barra-consulta button{background:#fff;color:var(--carbon);border-radius:999px;height:40px;padding:0 16px;font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px;flex:none;transition:opacity .12s;}
.barra-consulta button:hover{opacity:.88;}

/* ── Footer ── */
.pie{margin-top:28px;border-top:1px solid var(--borde);background:#fff;}
.pie-inner{max-width:820px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;}
@media (min-width:640px){ .pie-inner{flex-direction:row;justify-content:space-between;text-align:left;} }
.pie-marca{display:flex;align-items:center;gap:10px;}
.pie-logo{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;background:var(--hueso);}
.pie-logo img{width:100%;height:100%;object-fit:cover;}
.pie-nombre{font-family:'Big Shoulders',sans-serif;font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.3px;}
.pie-info{font-size:.72rem;color:var(--carbon-60);display:flex;flex-direction:column;gap:2px;}
.pie-whatsapp{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--marca);}
.pie-plataforma{text-align:center;padding:10px 16px 18px;font-size:.66rem;color:var(--carbon-60);opacity:.7;}
</style>
</head>
<body>

<div id="raiz"></div>

<script>
// ── Config: cómo este frontend único sabe de qué cliente es el catálogo ──
//
// Modo 1 (producción): la URL pública es catalogo.jpbalanceados.com/petshopjuan
// GitHub Pages redirige eso a /?cliente=petshopjuan (ver 404.html), y acá
// le preguntamos al proyecto central "¿cuál es el catálogo de petshopjuan?"
//
// Modo 2 (prueba rápida, sin depender del directorio): pasar directamente
// ?api=<url del endpoint del cliente>, salteando la resolución por slug.
const DIRECTORIO_URL = 'https://script.google.com/macros/s/AKfycbyDDyVLAvh3HbG9S4Ot_txcKS3Uj2qhdxxiITePNICvKH8HcsfgTxwUi-8iZUM3ltDqpw/exec';

const params = new URLSearchParams(location.search);
let API_URL = params.get('api') || '';
const CLIENTE_SLUG = params.get('cliente') || '';

let CATALOGO = null;
let productosActuales = [];
let listaConsulta = new Map(); // producto_id -> producto
let filtroTexto = '';
let filtroEspecie = '';
let filtroEtapa = '';
let filtroSoloDestacados = false;
let ordenActual = 'relevancia';
let claveAlmacenamiento = '';
let ultimoFocoAntesDeOverlay = null;

// ── Set de íconos SVG en línea (currentColor → heredan el color del
// texto/botón). Reemplazan los emojis: se ven iguales en cualquier
// dispositivo/SO y dan una terminación más prolija/comercial. ──
const ICN = {

function iconoImg(nombre, extra){ return '<span class="icono'+(extra?(' '+extra):'')+'">'+ICN[nombre]+'</span>'; }

function escaparHTML(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function monto(v){ return Number(v||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function estrellasTexto(v){
  if(!v) return '';
  let s=''; for(let i=1;i<=5;i++) s += i<=v ? '★' : '☆';
  return s;
}
// Varios nombres vienen armados como "Marca/Especie/-/Etapa/-/Peso" sin
// espacio alrededor de la barra — eso además de leerse mal, al no tener
// puntos de corte, empuja el ancho de la tarjeta. Acá solo se cambia
// cómo se MUESTRA, no el dato real.
function formatearNombreProducto(nombre){
  return String(nombre||'')
    .replace(/\s*\/\s*-?\s*\/\s*/g, ' / ')  // colapsa tramos vacíos tipo "/-/"
    .replace(/\/(?!\s)/g, ' / ')
    .replace(/\s+/g, ' ')
    .trim();
}
function precioEfectivo(p){ return (p.oferta && p.precio_oferta) ? p.precio_oferta : p.precio; }
function etapaDe(p){ return p.edad_etaria_canonica || p.ali_edad_etaria || ''; }

function imagenConFallback(url, alt){
  if(!url) return '<span class="sin-imagen">'+ICN.pata+'</span>';
  return '<span class="spinner spinner-imagen"></span>'+
    '<img src="'+escaparHTML(url)+'" alt="'+escaparHTML(alt)+'" loading="lazy" '+
    'onload="var s=this.previousElementSibling;if(s&&s.classList.contains(\'spinner-imagen\'))s.remove();" '+
    'onerror="var s=this.previousElementSibling;if(s&&s.classList.contains(\'spinner-imagen\'))s.remove();this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'sin-imagen\',innerHTML:ICN.pata}))">';
}

// Tarjeta de producto — se usa tanto en la grilla principal como en
// "También te puede interesar" dentro de la ficha, para que se vean
// exactamente iguales y el click (abrir / agregar a la lista) funcione
// en los dos lugares sin código repetido.
function htmlTarjetaProducto(p){
  const enLista = listaConsulta.has(p.producto_id);
  let precioHtml;
  if(p.oferta && p.precio_oferta){
    precioHtml = '<span class="precio-oferta">$'+monto(p.precio_oferta)+'</span><span class="tachado">$'+monto(p.precio)+'</span>';
  } else {
    precioHtml = '$'+monto(p.precio);
  }
  const etapa = etapaDe(p);
  const etiquetas = [p.especie_nombre || '', etapa || ''].filter(Boolean);
  return '<article class="card" data-id="'+escaparHTML(p.producto_id)+'">'+
    '<div class="card-badges">'+
      (p.oferta ? '<span class="badge badge-oferta">Oferta</span>' : '')+
      (p.destacado ? '<span class="badge badge-destacado">★ Destacado</span>' : '')+
    '</div>'+
    '<button class="card-abrir" data-id="'+escaparHTML(p.producto_id)+'">'+
      '<div class="card-img">'+imagenConFallback(p.imagen_url, p.nombre)+'</div>'+
      '<div class="card-marca">'+escaparHTML(p.marca_nombre)+'</div>'+
      (etiquetas.length ? '<div class="card-etiquetas">'+etiquetas.map(function(t){ return '<span class="etiqueta">'+escaparHTML(t)+'</span>'; }).join('')+'</div>' : '')+
      '<div class="card-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</div>'+
      (p.estrella ? '<div class="card-estrellas">'+estrellasTexto(p.estrella)+'</div>' : '')+
      '<div class="card-precio">'+precioHtml+'</div>'+
    '</button>'+
    '<button class="card-btn-agregar'+(enLista?' en-lista':'')+'" data-id="'+escaparHTML(p.producto_id)+'">'+
      (enLista ? '✓ En tu lista' : '+ Agregar a la lista')+
    '</button>'+
  '</article>';
}

// Favicon dinámico: como este mismo HTML sirve a cientos de comercios,
// no hay un ícono fijo posible — se arma en tiempo real con el logo del
// negocio apenas se conoce.
function actualizarFavicon(url){
  if(!url) return;
  let link = document.querySelector('link[rel="icon"]');
  if(!link){ link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
  link.href = url;
}

// ── Persistencia de la lista de consulta (localStorage, por catálogo) ──
function cargarListaGuardada(){
  if(!claveAlmacenamiento) return;
  try{
    const raw = localStorage.getItem(claveAlmacenamiento);
    if(!raw) return;
    const ids = JSON.parse(raw);
    (ids||[]).forEach(function(id){
      const p = CATALOGO.productos.find(function(x){ return x.producto_id===id; });
      if(p) listaConsulta.set(id, p);
    });
  }catch(e){ /* si está corrupto, arrancamos con la lista vacía */ }
}
function guardarListaEnStorage(){
  if(!claveAlmacenamiento) return;
  try{ localStorage.setItem(claveAlmacenamiento, JSON.stringify(Array.from(listaConsulta.keys()))); }catch(e){}
}

async function iniciar(){
  if(!API_URL && !CLIENTE_SLUG){
    pintarEstado('enlace','Falta identificar el comercio','Esta página necesita saber de qué comercio es el catálogo (parámetro cliente o api en la dirección).');
    return;
  }
  pintarCargando();

  if(!API_URL){
    try{
      const resDirectorio = await fetch(DIRECTORIO_URL + '?catalogo_de=' + encodeURIComponent(CLIENTE_SLUG), { cache: 'no-store' });
      const jsonDirectorio = await resDirectorio.json();
      if(!jsonDirectorio || !jsonDirectorio.success){
        pintarEstado('caja','No encontramos ese catálogo', (jsonDirectorio && jsonDirectorio.error) || 'Revisá el enlace e intentá de nuevo.', true);
        return;
      }
      API_URL = jsonDirectorio.api_url;
    }catch(e){
      pintarEstado('alerta','No se pudo identificar el comercio','Revisá tu conexión e intentá de nuevo en unos minutos.', true);
      return;
    }
  }

  try{
    const res = await fetch(API_URL, { cache: 'no-store' });
    const json = await res.json();
    if(!json || !json.success){
      pintarEstado('caja','Este catálogo todavía no está disponible', (json && json.error) || 'Volvé a intentarlo más tarde.', true);
      return;
    }
    CATALOGO = json.data;
    claveAlmacenamiento = 'lista_consulta:' + API_URL;
    cargarListaGuardada();
    renderPagina();
  }catch(e){
    pintarEstado('alerta','No se pudo cargar el catálogo','Revisá tu conexión e intentá de nuevo en unos minutos.', true);
  }
}

function especiesUnicas(){
  const set = new Map();
  CATALOGO.productos.forEach(function(p){
    if(p.especie_id) set.set(String(p.especie_id), p.especie_nombre || ('Especie '+p.especie_id));
  });
  return set;
}
function etapasUnicas(){
  const set = new Map();
  CATALOGO.productos.forEach(function(p){
    const e = etapaDe(p);
    if(e) set.set(e, e);
  });
  return set;
}
function contarPor(campo, valor){
  return CATALOGO.productos.filter(function(p){ return String(p[campo]||'')===String(valor); }).length;
}
function contarEtapa(valor){
  return CATALOGO.productos.filter(function(p){ return etapaDe(p)===valor; }).length;
}
function contarDestacados(){
  return CATALOGO.productos.filter(function(p){ return !!p.destacado; }).length;
}

  document.getElementById('btnEnviarDesdeLista').addEventListener('click', function(){ enviarConsultaWhatsapp(); });

  if(numeroWa){
    document.getElementById('btnWhatsappHeader').addEventListener('click', function(){
      const texto = 'Hola! Estoy viendo el catálogo de ' + (negocio.nombre_comercio||'') + ' y tengo una consulta.';
      window.open('https://wa.me/'+numeroWa+'?text='+encodeURIComponent(texto), '_blank');
    });
  }

  document.getElementById('btnCompartirCatalogo').addEventListener('click', function(){
    const datosCompartir = { title: tituloPagina, text: 'Mirá el catálogo de ' + (negocio.nombre_comercio||'este comercio'), url: location.href };
    if(navigator.share){ navigator.share(datosCompartir).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(function(){ alert('Enlace copiado.'); }); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(document.getElementById('overlayFicha').classList.contains('abierto')) cerrarFicha();
    else if(document.getElementById('overlayLista').classList.contains('abierto')) cerrarLista();
  });

  renderBarraConsulta();
  aplicarFiltros();
}

function aplicarFiltros(){
  let lista = CATALOGO.productos.slice();
  if(filtroEspecie) lista = lista.filter(function(p){ return String(p.especie_id||'')===filtroEspecie; });
  if(filtroEtapa) lista = lista.filter(function(p){ return etapaDe(p)===filtroEtapa; });
  if(filtroSoloDestacados) lista = lista.filter(function(p){ return !!p.destacado; });
  if(filtroTexto){
    lista = lista.filter(function(p){
      const hay = [p.nombre,p.marca_nombre,p.sku].join(' ').toLowerCase();
      return hay.indexOf(filtroTexto) !== -1;
    });
  }

  if(ordenActual === 'precio_asc'){
    lista.sort(function(a,b){ return precioEfectivo(a)-precioEfectivo(b); });
  } else if(ordenActual === 'precio_desc'){
    lista.sort(function(a,b){ return precioEfectivo(b)-precioEfectivo(a); });
  } else if(ordenActual === 'mejor_valorados'){
    lista.sort(function(a,b){ return (b.estrella||0)-(a.estrella||0); });
  } else {
    // Relevancia (orden por defecto): 1) ofertas, 2) destacados, 3) mejor
    // calificados, 4) el resto.
    lista.sort(function(a,b){
      if(!!b.oferta !== !!a.oferta) return b.oferta ? 1 : -1;
      if(!!b.destacado !== !!a.destacado) return b.destacado ? 1 : -1;
      return (b.estrella||0)-(a.estrella||0);
    });
  }

  productosActuales = lista;
  const hayFiltrosActivos = !!(filtroTexto || filtroEspecie || filtroEtapa || filtroSoloDestacados);
  document.getElementById('resultadoInfo').innerHTML =
    '<span>'+lista.length+(lista.length===1?' producto encontrado':' productos encontrados')+'</span>'+
    (hayFiltrosActivos ? '<button class="link-limpiar" onclick="limpiarTodosLosFiltros()">Limpiar filtros</button>' : '');
  renderGrid();
}

function limpiarTodosLosFiltros(){
  filtroTexto=''; filtroEspecie=''; filtroEtapa=''; filtroSoloDestacados=false;
  document.getElementById('buscador').value='';
  document.getElementById('btnLimpiarBuscador').classList.remove('visible');
  document.querySelectorAll('#chipsEspecie .chip, #chipsEtapa .chip').forEach(function(c){ c.classList.toggle('activo', c.dataset.val===''); });
  aplicarFiltros();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if(!productosActuales.length){
    grid.innerHTML = '<div class="vacio-grid">'+iconoImg('buscar').replace('width="16" height="16"','width="34" height="34"')+
      '<span>No encontramos productos con esos filtros. Probá con otra búsqueda.</span>'+
      '<button class="btn btn-fantasma" style="flex:none;padding:0 18px" onclick="limpiarTodosLosFiltros()">Limpiar filtros</button>'+
    '</div>';
    return;
  }
  grid.innerHTML = productosActuales.map(htmlTarjetaProducto).join('');
}

document.getElementById('raiz').addEventListener('click', function(e){
  const btnAbrir = e.target.closest('.card-abrir');
  if(btnAbrir){ abrirFicha(btnAbrir.dataset.id); return; }
  const btnAgregar = e.target.closest('.card-btn-agregar');
  if(btnAgregar){ toggleConsulta(btnAgregar.dataset.id); return; }
});

function toggleConsulta(id){
  const producto = CATALOGO.productos.find(function(p){ return p.producto_id===id; });
  if(!producto) return;
  if(listaConsulta.has(id)) listaConsulta.delete(id); else listaConsulta.set(id, producto);
  guardarListaEnStorage();
  renderGrid();
  renderBarraConsulta();
  const enLista = listaConsulta.has(id);
  // La grilla principal ya se re-renderiza entera (renderGrid), pero las
  // tarjetas de "también te puede interesar" dentro de la ficha abierta
  // no forman parte de ese render — se actualizan acá directamente.
  document.querySelectorAll('.card-btn-agregar[data-id="'+CSS.escape(id)+'"]').forEach(function(btn){
    btn.classList.toggle('en-lista', enLista);
    btn.textContent = enLista ? '✓ En tu lista' : '+ Agregar a la lista';
  });
  const btnFicha = document.getElementById('btnFichaAgregar');
  if(btnFicha && btnFicha.dataset.id === id){
    btnFicha.textContent = enLista ? '✓ En tu lista' : '+ Agregar a mi lista';
  }
  if(document.getElementById('overlayLista').classList.contains('abierto')) renderListaContenido();
}

function renderBarraConsulta(){
  const barra = document.getElementById('barraConsulta');
  const cantidad = listaConsulta.size;
  document.getElementById('contadorConsulta').textContent = cantidad;
  barra.classList.toggle('visible', cantidad>0);
}

// "También te puede interesar" — prioriza misma especie, etapa, marca y
// rango de precio similar (±35%), y dentro de eso ordena ofertas primero,
// después destacados, después por puntaje de similitud y calificación.
function productosRelacionados(p){
  const precioP = precioEfectivo(p);
  const etapaP = etapaDe(p);

  let candidatos = CATALOGO.productos
    .filter(function(x){ return x.producto_id !== p.producto_id; })
    .map(function(x){
      let score = 0;
      if(p.especie_id && x.especie_id === p.especie_id) score += 4;
      if(etapaP && etapaDe(x) === etapaP) score += 2;
      if(p.marca_nombre && x.marca_nombre === p.marca_nombre) score += 2;
      if(precioP > 0){
        const precioX = precioEfectivo(x);
        if(Math.abs(precioX - precioP) / precioP <= 0.35) score += 1;
      }
      return { x: x, score: score };
    })
    .filter(function(o){ return o.score > 0; });

  candidatos.sort(function(a,b){
    if(!!b.x.oferta !== !!a.x.oferta) return b.x.oferta ? 1 : -1;
    if(!!b.x.destacado !== !!a.x.destacado) return b.x.destacado ? 1 : -1;
    if(b.score !== a.score) return b.score - a.score;
    return (b.x.estrella||0) - (a.x.estrella||0);
  });

  return candidatos.slice(0, 8).map(function(o){ return o.x; });
}

function htmlImagenHero(url, alt){
  if(!url) return '<span class="sin-imagen">'+ICN.pata+'</span>';
  return '<span class="spinner spinner-imagen"></span>'+
    '<img class="ficha-hero-img" src="'+escaparHTML(url)+'" alt="'+escaparHTML(alt)+'" loading="lazy" '+
    'onload="var s=this.previousElementSibling;if(s&&s.classList.contains(\'spinner-imagen\'))s.remove();" '+
    'onerror="var s=this.previousElementSibling;if(s&&s.classList.contains(\'spinner-imagen\'))s.remove();this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'sin-imagen\',innerHTML:ICN.pata}))">';
}

function abrirFicha(id){
  const p = CATALOGO.productos.find(function(x){ return x.producto_id===id; });
  if(!p) return;
  const galeria = [p.imagen_url].concat(p.galeria_imagenes||[]).filter(Boolean);
  const enLista = listaConsulta.has(id);
  const relacionados = productosRelacionados(p);

  let precioHtml;
  if(p.oferta && p.precio_oferta){
    precioHtml = '<span class="ficha-precio precio-oferta">$'+monto(p.precio_oferta)+'</span><span class="ficha-precio tachado">$'+monto(p.precio)+'</span>';
  } else {
    precioHtml = '<span class="ficha-precio">$'+monto(p.precio)+'</span>';
  }

  const badgesHero = (p.oferta ? '<span class="badge badge-oferta">Oferta</span>' : '') +
    (p.destacado ? '<span class="badge badge-destacado">★ Destacado</span>' : '');

  const mediaHtml =
    '<div class="ficha-media">'+
      '<div class="ficha-hero">'+
        (badgesHero ? '<div class="ficha-hero-badges">'+badgesHero+'</div>' : '')+
        '<div id="fichaHeroImg">'+htmlImagenHero(galeria[0], p.nombre)+'</div>'+
      '</div>'+
      (galeria.length > 1 ? '<div class="ficha-miniaturas">'+
        galeria.map(function(url, i){
          return '<button data-idx="'+i+'" data-url="'+escaparHTML(url)+'" class="'+(i===0?'activa':'')+'" aria-label="Ver imagen '+(i+1)+'">'+imagenConFallback(url, p.nombre)+'</button>';
        }).join('')+'</div>' : '')+
    '</div>';

  // Estructura pedida: imagen, marca, nombre, calificación, precio,
  // botones de acción, descripción, ingredientes, información nutricional.
  const infoHtml =
    '<div class="ficha-info">'+
      '<div class="ficha-marca">'+escaparHTML(p.marca_nombre)+'</div>'+
      '<h2 id="fichaTituloAria" class="ficha-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</h2>'+
      (p.estrella ? '<div class="ficha-estrellas">'+estrellasTexto(p.estrella)+'</div>' : '')+
      '<div class="ficha-precio-fila">'+precioHtml+'</div>'+
      '<div class="ficha-botones">'+
        '<button class="btn btn-fantasma" id="btnFichaAgregar" data-id="'+escaparHTML(id)+'">'+(enLista?'✓ En tu lista':'+ Agregar a mi lista')+'</button>'+
        '<button class="btn btn-primario" id="btnFichaWhatsapp">'+iconoImg('whatsapp')+'Consultar por WhatsApp</button>'+
      '</div>'+
      (p.descripcion ? '<div class="ficha-seccion"><h3>Descripción</h3><p>'+escaparHTML(p.descripcion)+'</p></div>' : '')+
      (p.ingredientes ? '<div class="ficha-seccion"><h3>Ingredientes</h3><p>'+escaparHTML(p.ingredientes)+'</p></div>' : '')+
      (p.info_nutricional ? '<div class="ficha-seccion"><h3>Información nutricional</h3><p>'+escaparHTML(p.info_nutricional)+'</p></div>' : '')+
    '</div>';

  document.getElementById('fichaContenido').innerHTML =
    '<div class="ficha-cuerpo">'+mediaHtml+infoHtml+'</div>'+
    (relacionados.length ? '<div class="ficha-seccion"><h3>También te puede interesar</h3><div class="scroll-desvanecido"><div class="relacionados-fila">'+
      relacionados.map(htmlTarjetaProducto).join('')+
    '</div></div></div>' : '');

  document.getElementById('fichaContenido').querySelectorAll('.ficha-miniaturas button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('fichaHeroImg').innerHTML = htmlImagenHero(btn.dataset.url, p.nombre);
      document.querySelectorAll('.ficha-miniaturas button').forEach(function(b){ b.classList.toggle('activa', b===btn); });
    });
  });

  document.getElementById('btnFichaAgregar').addEventListener('click', function(){ toggleConsulta(id); });
  document.getElementById('btnFichaWhatsapp').addEventListener('click', function(){ enviarConsultaWhatsapp([p]); });

  ultimoFocoAntesDeOverlay = document.activeElement;
  document.getElementById('overlayFicha').classList.add('abierto');
  document.getElementById('btnCerrarFicha').focus();
}

function cerrarFicha(){
  document.getElementById('overlayFicha').classList.remove('abierto');
  if(ultimoFocoAntesDeOverlay) ultimoFocoAntesDeOverlay.focus();
}

function abrirLista(){
  renderListaContenido();
  ultimoFocoAntesDeOverlay = document.activeElement;
  document.getElementById('overlayLista').classList.add('abierto');
  document.getElementById('btnCerrarLista').focus();
}
function cerrarLista(){
  document.getElementById('overlayLista').classList.remove('abierto');
  if(ultimoFocoAntesDeOverlay) ultimoFocoAntesDeOverlay.focus();
}

function renderListaContenido(){
  const cont = document.getElementById('listaContenido');
  const productos = Array.from(listaConsulta.values());
  if(!productos.length){
    cont.innerHTML = '<div class="lista-vacia">Todavía no agregaste productos.</div>';
    return;
  }
  cont.innerHTML = productos.map(function(p){
    return '<div class="lista-item" data-id="'+escaparHTML(p.producto_id)+'">'+
      '<div class="card-img">'+imagenConFallback(p.imagen_url, p.nombre)+'</div>'+
      '<div class="lista-item-info">'+
        '<div class="lista-item-nombre">'+escaparHTML(formatearNombreProducto(p.nombre))+'</div>'+
        '<div class="lista-item-precio">$'+monto(precioEfectivo(p))+'</div>'+
      '</div>'+
      '<button class="lista-item-quitar" data-id="'+escaparHTML(p.producto_id)+'" aria-label="Quitar">✕</button>'+
    '</div>';
  }).join('');
  cont.querySelectorAll('.lista-item-quitar').forEach(function(btn){
    btn.addEventListener('click', function(){ toggleConsulta(btn.dataset.id); });
  });
}

function enviarConsultaWhatsapp(productosForzados){
  const productos = productosForzados || Array.from(listaConsulta.values());
  if(!productos.length){ alert('Agregá al menos un producto a tu lista.'); return; }

  const negocio = (CATALOGO && CATALOGO.negocio) || {};
  const numero = String(negocio.whatsapp_numero || '').replace(/[^\d]/g,'');

  const lineas = productos.map(function(p){ return '- '+formatearNombreProducto(p.nombre) + (p.marca_nombre ? ' ('+p.marca_nombre+')' : ''); });
  const texto = 'Hola. Estoy interesado en los siguientes productos:\n\n'+lineas.join('\n')+'\n\nEspero su respuesta.';

  const url = (numero ? 'https://wa.me/'+numero : 'https://wa.me/') + '?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}
