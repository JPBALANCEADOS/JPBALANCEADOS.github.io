<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2D6A4F">
<title>Catálogo Pro</title>
<meta property="og:title" content="Catálogo online">
<meta property="og:description" content="Mirá los productos, precios y ofertas — y consultá directo por WhatsApp.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marca:#2D6A4F;
  --marca-oscura:#1F4D38;
  --marca-pale:#E4F0EA;
  --hueso:#F6F5F1;
  --carbon:#1A1D1B;
  --carbon-60:#5B6560;
  --borde:#E5E2D9;
  --blanco:#FFFFFF;
  --rojo:#C1121F;
  --amarillo:#C89B3C;
  --radio:16px;
  --radio-sm:10px;
  --sombra: 0 8px 20px rgba(0,0,0,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--hueso);color:var(--carbon);line-height:1.45;padding-bottom:90px;-webkit-tap-highlight-color: transparent;}
body.modal-abierto{overflow:hidden;}
h1,h2,h3{font-family:'Big Shoulders',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.3px;line-height:1.05;}
button{font:inherit;cursor:pointer;border:none;background:none;user-select:none;}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;}

/* ── Estados ── */
.estado-pantalla{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 24px;text-align:center;color:var(--carbon-60);}
.estado-pantalla .glifo{font-size:42px;}
.estado-pantalla h2{font-size:22px;color:var(--carbon);text-transform:none;}
.estado-pantalla p{font-size:14px;max-width:360px;}

/* ── Skeletons ── */
.skeleton-portada{height:160px;background:linear-gradient(160deg,var(--marca-oscura),var(--marca));}
.skeleton-grid{max-width:820px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:560px){ .skeleton-grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .skeleton-grid{grid-template-columns:repeat(4,1fr);} }
.skeleton-card{height:220px;border-radius:var(--radio);background:linear-gradient(100deg,#eceae3 30%,#f5f3ee 45%,#eceae3 60%);background-size:200% 100%;animation:brillo 1.4s ease-in-out infinite;}
@keyframes brillo{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── Header / Portada ── */
header.marca{background:var(--marca);color:#fff;}
.portada{position:relative;min-height:150px;background-color:var(--marca-oscura);background-size:cover;background-position:center;}
.portada-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.6));}
.marca-info{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 20px;max-width:820px;margin:0 auto;}
.marca-info-izq{display:flex;align-items:center;gap:14px;min-width:0;}
.marca-logo{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);border:2px solid #fff;}
.marca-logo img{width:100%;height:100%;object-fit:cover;}
.marca-logo .sin-logo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;}
.marca-nombre{font-size:clamp(20px,5vw,32px);color:#fff;overflow-wrap:break-word;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.4);}
.btn-compartir{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(4px);transition:background .2s;}
.btn-compartir:active{transform:scale(0.95);background:rgba(255,255,255,.3);}

/* ── Buscador + Filtros Sticky ── */
.barra-filtros{position:sticky;top:0;z-index:20;background:var(--blanco);border-bottom:1px solid var(--borde);box-shadow:0 2px 12px rgba(0,0,0,.05);}
.barra-filtros-inner{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.fila-buscador-orden{display:flex;gap:8px;}
.buscador-wrap{position:relative;flex:1;min-width:0;}
.buscador-wrap input{width:100%;height:44px;padding:0 36px 0 38px;border:1.5px solid var(--borde);border-radius:999px;font-size:.92rem;outline:none;background:var(--hueso);transition:border-color .2s, background .2s;}
.buscador-wrap input:focus{border-color:var(--marca);background:#fff;}
.buscador-icono{position:absolute;top:50%;left:14px;transform:translateY(-50%);font-size:15px;pointer-events:none;opacity:.5;}
.buscador-limpiar{display:none;position:absolute;top:50%;right:10px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--borde);color:var(--carbon-60);font-size:12px;align-items:center;justify-content:center;}
.buscador-limpiar.visible{display:flex;}
.orden-select{flex:none;height:44px;padding:0 12px;border:1.5px solid var(--borde);border-radius:999px;background:var(--hueso);font-size:.8rem;font-weight:600;color:var(--carbon-60);max-width:135px;outline:none;}

.chips-fila{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips-fila::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 14px;border:1.5px solid var(--borde);border-radius:999px;background:#fff;color:var(--carbon-60);font-size:.8rem;font-weight:600;white-space:nowrap;transition:all .15s ease;}
.chip.activo{border-color:var(--marca);background:var(--marca);color:#fff;}

/* ── Productos ── */
.contenido{max-width:820px;margin:0 auto;padding:18px 16px 8px;}
.resultado-info{font-size:.8rem;color:var(--carbon-60);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.resultado-info .link-limpiar{color:var(--marca);font-weight:700;font-size:.78rem;}

.grid-productos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:560px){ .grid-productos{grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .grid-productos{grid-template-columns:repeat(4,1fr);} }

.card{background:#fff;border-radius:var(--radio);border:1px solid var(--borde);padding:10px;position:relative;display:flex;flex-direction:column;box-shadow:var(--sombra);transition:transform .15s ease, box-shadow .15s ease;animation:aparecer .25s ease both;}
@keyframes aparecer{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.08);}

.card-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:1;}
.badge{padding:3px 8px;border-radius:999px;font-size:.58rem;font-weight:800;text-transform:uppercase;color:#fff;}
.badge-destacado{background:var(--amarillo);color:#2A1F04;}
.badge-oferta{background:var(--rojo);}

.card-img{height:110px;display:flex;align-items:center;justify-content:center;background:var(--hueso);border-radius:var(--radio-sm);overflow:hidden;margin-bottom:8px;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.sin-imagen{font-size:28px;opacity:.3;}

.card-marca{font-size:.62rem;text-transform:uppercase;color:var(--carbon-60);font-weight:600;}
.card-nombre{font-size:.84rem;font-weight:700;margin:2px 0 6px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-precio{font-size:.95rem;font-weight:800;margin-top:auto;}
.card-precio .tachado{margin-left:6px;font-size:.72rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.card-estrellas{color:var(--amarillo);font-size:.75rem;margin-top:2px;}

.card-btn-agregar{margin-top:10px;padding:8px;border-radius:var(--radio-sm);border:1.5px solid var(--marca);color:var(--marca);font-size:.75rem;font-weight:700;background:#fff;transition:all .15s ease;}
.card-btn-agregar:active{transform:scale(0.97);}
.card-btn-agregar.en-lista{background:var(--marca);color:#fff;}

/* ── Overlays y Modales ── */
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);align-items:flex-end;justify-content:center;transition:background .25s ease;}
.overlay.abierto{display:flex;background:rgba(0,0,0,.55);}
@media (min-width:640px){ .overlay{align-items:center;} }

.hoja{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:20px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);position:relative;}
.overlay.abierto .hoja{transform:translateY(0);}
@media (min-width:640px){ .hoja{border-radius:var(--radio);max-height:85vh;transform:translateY(16px) scale(.96);opacity:0;transition:all .2s ease;} .overlay.abierto .hoja{transform:translateY(0) scale(1);opacity:1;} }

.hoja-agarre{width:36px;height:4px;border-radius:4px;background:var(--borde);margin:0 auto 14px;}
.hoja-cerrar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--hueso);font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2;}

/* ── Ficha de Producto ── */
.ficha-galeria{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.ficha-galeria img{width:110px;height:110px;object-fit:cover;border-radius:var(--radio-sm);flex:none;background:var(--hueso);}
.ficha-marca{font-size:.72rem;text-transform:uppercase;color:var(--carbon-60);font-weight:600;}
.ficha-nombre{font-size:1.25rem;margin:2px 0 8px;}
.ficha-precio-fila{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.ficha-precio{font-size:1.45rem;font-weight:800;}
.ficha-precio.tachado{font-size:.95rem;font-weight:600;color:var(--carbon-60);text-decoration:line-through;}
.ficha-seccion{margin-top:14px;border-top:1px solid var(--borde);padding-top:10px;}
.ficha-seccion h3{font-size:.72rem;color:var(--carbon-60);text-transform:uppercase;margin-bottom:4px;}
.ficha-seccion p{font-size:.88rem;color:var(--carbon);white-space:pre-line;}

.ficha-botones{display:flex;gap:10px;margin-top:20px;}
.btn{flex:1;height:48px;border-radius:999px;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s ease;}
.btn:active{transform:scale(.97);}
.btn-primario{background:var(--marca);color:#fff;}
.btn-fantasma{background:var(--marca-pale);color:var(--marca-oscura);}

/* ── Lista / Carrito ── */
.lista-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--borde);}
.lista-item .card-img{width:48px;height:48px;flex:none;margin:0;}
.lista-item-info{flex:1;min-width:0;}
.lista-item-nombre{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lista-item-precio{font-size:.78rem;color:var(--carbon-60);}
.lista-item-quitar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--hueso);color:var(--carbon-60);font-size:14px;}

/* ── Barra Flotante WhatsApp ── */
.barra-consulta{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;max-width:520px;margin:0 auto;background:var(--carbon);color:#fff;border-radius:999px;padding:8px;display:none;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .25s ease;}
.barra-consulta.visible{display:flex;transform:translateY(0);}
.barra-consulta-texto{flex:1;padding:0 12px;font-size:.85rem;font-weight:600;text-align:left;}
.barra-consulta-texto strong{font-family:'Big Shoulders',sans-serif;font-size:1.2rem;margin-right:4px;}
.barra-consulta button.btn-ws{background:#25D366;color:#fff;border-radius:999px;height:42px;padding:0 18px;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:6px;}

.footer-nota{max-width:820px;margin:24px auto 0;padding:0 16px;font-size:.72rem;color:var(--carbon-60);text-align:center;}
</style>
</head>
<body>

<div id="raiz"></div>

<script>
const DIRECTORIO_URL = 'https://script.google.com/macros/s/TU_ID_DEL_PROYECTO_CENTRAL/exec';

const params = new URLSearchParams(location.search);
let API_URL = params.get('api') || '';
const CLIENTE_SLUG = params.get('cliente') || '';

let CATALOGO = null;
let productosActuales = [];
let listaConsulta = new Map();
let filtroTexto = '', filtroEspecie = '', filtroCategoria = '', ordenActual = 'relevancia';
let claveAlmacenamiento = '';
let ultimoFoco = null;

// Sanitize & Helpers
function escaparHTML(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function monto(v){ return Number(v||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function estrellasTexto(v){ return '★'.repeat(Math.min(5, Math.max(0, v || 0))) + '☆'.repeat(5 - Math.min(5, Math.max(0, v || 0))); }

function imagenConFallback(url, alt){
  if(!url) return '<span class="sin-imagen">🐾</span>';
  return `<img src="${escaparHTML(url)}" alt="${escaparHTML(alt)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sin-imagen',textContent:'🐾'}))">`;
}

function alternarScrollBody(bloquear){
  document.body.classList.toggle('modal-abierto', bloquear);
}

function pintarEstado(glifo, titulo, texto, reintentar){
  document.getElementById('raiz').innerHTML = `
    <div class="estado-pantalla">
      <div class="glifo">${glifo}</div>
      <h2>${escaparHTML(titulo)}</h2>
      <p>${escaparHTML(texto)}</p>
      ${reintentar ? '<button class="btn btn-primario" style="margin-top:10px" onclick="location.reload()">Reintentar</button>' : ''}
    </div>`;
}

function pintarSkeleton(){
  document.getElementById('raiz').innerHTML = `
    <div class="skeleton-portada"></div>
    <div class="skeleton-grid">${Array(8).fill('<div class="skeleton-card"></div>').join('')}</div>`;
}

function cargarListaGuardada(){
  if(!claveAlmacenamiento) return;
  try{
    const raw = localStorage.getItem(claveAlmacenamiento);
    if(raw){
      JSON.parse(raw).forEach(id => {
        const p = CATALOGO.productos.find(x => x.producto_id === id);
        if(p) listaConsulta.set(id, p);
      });
    }
  }catch(e){}
}
function guardarListaEnStorage(){
  if(claveAlmacenamiento){
    try{ localStorage.setItem(claveAlmacenamiento, JSON.stringify(Array.from(listaConsulta.keys()))); }catch(e){}
  }
}

async function iniciar(){
  if(!API_URL && !CLIENTE_SLUG){
    pintarEstado('🔗','Falta identificar el comercio','Esta página requiere el parámetro de comercio en la URL.');
    return;
  }
  pintarSkeleton();

  if(!API_URL){
    try{
      const res = await fetch(`${DIRECTORIO_URL}?catalogo_de=${encodeURIComponent(CLIENTE_SLUG)}`, { cache: 'no-store' });
      const json = await res.json();
      if(!json || !json.success) throw new Error((json && json.error) || 'No encontrado');
      API_URL = json.api_url;
    }catch(e){
      pintarEstado('📭','Catálogo no encontrado', e.message, true);
      return;
    }
  }

  try{
    const res = await fetch(API_URL, { cache: 'no-store' });
    const json = await res.json();
    if(!json || !json.success) throw new Error();
    CATALOGO = json.data;
    claveAlmacenamiento = 'lista_consulta:' + API_URL;
    cargarListaGuardada();
    renderPagina();
  }catch(e){
    pintarEstado('⚠️','Error de carga','No pudimos obtener la información del catálogo.', true);
  }
}

function renderPagina(){
  const negocio = CATALOGO.negocio || {};
  document.documentElement.style.setProperty('--marca', negocio.color_marca || '#2D6A4F');
  document.title = negocio.nombre_comercio ? `${negocio.nombre_comercio} — Catálogo` : 'Catálogo';

  const especies = new Map(), categorias = new Map();
  CATALOGO.productos.forEach(p => {
    if(p.especie_id) especies.set(String(p.especie_id), p.especie_nombre || `Especie ${p.especie_id}`);
    if(p.categoria_id) categorias.set(String(p.categoria_id), p.categoria_nombre || `Categoría ${p.categoria_id}`);
  });

  const htmlEspecies = ['<div class="chip activo" data-tipo="especie" data-val="">Todas</div>']
    .concat(Array.from(especies).map(([k,v]) => `<div class="chip" data-tipo="especie" data-val="${escaparHTML(k)}">${escaparHTML(v)}</div>`)).join('');
  const htmlCategorias = ['<div class="chip activo" data-tipo="categoria" data-val="">Todas</div>']
    .concat(Array.from(categorias).map(([k,v]) => `<div class="chip" data-tipo="categoria" data-val="${escaparHTML(k)}">${escaparHTML(v)}</div>`)).join('');

  document.getElementById('raiz').innerHTML = `
    <header class="marca">
      <div class="portada" id="portadaBg">
        <div class="portada-overlay"></div>
        <div class="marca-info">
          <div class="marca-info-izq">
            <div class="marca-logo">${negocio.logo_url ? `<img src="${escaparHTML(negocio.logo_url)}" alt="">` : '<span class="sin-logo">🐾</span>'}</div>
            <h1 class="marca-nombre">${escaparHTML(negocio.nombre_comercio || 'Catálogo')}</h1>
          </div>
          <button class="btn-compartir" id="btnCompartir" title="Compartir">🔗</button>
        </div>
      </div>
    </header>
    <div class="barra-filtros"><div class="barra-filtros-inner">
      <div class="fila-buscador-orden">
        <div class="buscador-wrap">
          <span class="buscador-icono">🔍</span>
          <input id="buscador" type="text" placeholder="Buscar productos..." aria-label="Buscar">
          <button class="buscador-limpiar" id="btnLimpiarBuscador">✕</button>
        </div>
        <select id="ordenSelect" class="orden-select">
          <option value="relevancia">Destacados</option>
          <option value="precio_asc">Precio ↑</option>
          <option value="precio_desc">Precio ↓</option>
          <option value="mejor_valorados">Valoración</option>
        </select>
      </div>
      <div id="chipsEspecie" class="chips-fila">${htmlEspecies}</div>
      <div id="chipsCategoria" class="chips-fila">${htmlCategorias}</div>
    </div></div>
    <main class="contenido">
      <div id="resultadoInfo" class="resultado-info"></div>
      <div id="grid" class="grid-productos"></div>
    </main>
    <p class="footer-nota">Catálogo actualizado · Precios sujetos a modificación.</p>
    
    <div id="barraConsulta" class="barra-consulta">
      <button id="btnVerLista" class="barra-consulta-texto" style="background:none;color:#fff;"><strong id="contadorConsulta">0</strong> en tu lista</button>
      <button class="btn-ws" id="btnEnviarConsulta">Enviar WhatsApp</button>
    </div>

    <div id="overlayFicha" class="overlay"><div class="hoja">
      <button class="hoja-cerrar" class="cerrar-overlay">✕</button>
      <div class="hoja-agarre"></div>
      <div id="fichaContenido"></div>
    </div></div>

    <div id="overlayLista" class="overlay"><div class="hoja">
      <button class="hoja-cerrar" class="cerrar-overlay">✕</button>
      <div class="hoja-agarre"></div>
      <h2 style="font-size:1.1rem;margin-bottom:12px">Tu Selección</h2>
      <div id="listaContenido"></div>
      <div class="ficha-botones">
        <button class="btn btn-primario" id="btnEnviarDesdeLista">Enviar consulta por WhatsApp</button>
      </div>
    </div></div>`;

  // Asignación segura de fondo para evitar inyección XSS vía CSS url()
  if(negocio.portada_url){
    document.getElementById('portadaBg').style.backgroundImage = `url(${JSON.stringify(negocio.portada_url)})`;
  }

  // Event Listeners
  const buscador = document.getElementById('buscador');
  buscador.addEventListener('input', e => {
    filtroTexto = e.target.value.trim().toLowerCase();
    document.getElementById('btnLimpiarBuscador').classList.toggle('visible', !!filtroTexto);
    aplicarFiltros();
  });
  document.getElementById('btnLimpiarBuscador').addEventListener('click', () => {
    buscador.value = ''; filtroTexto = '';
    document.getElementById('btnLimpiarBuscador').classList.remove('visible');
    aplicarFiltros();
  });

  document.getElementById('ordenSelect').addEventListener('change', e => { ordenActual = e.target.value; aplicarFiltros(); });
  
  const bindChips = (id, varRef) => {
    document.getElementById(id).addEventListener('click', e => {
      const chip = e.target.closest('.chip'); if(!chip) return;
      if(id === 'chipsEspecie') filtroEspecie = chip.dataset.val;
      else filtroCategoria = chip.dataset.val;
      document.querySelectorAll(`#${id} .chip`).forEach(c => c.classList.toggle('activo', c === chip));
      aplicarFiltros();
    });
  };
  bindChips('chipsEspecie'); bindChips('chipsCategoria');

  // Controladores de Modales / Overlays
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => {
      if(e.target === ov || e.target.classList.contains('hoja-cerrar')) cerrarModales();
    });
  });

  document.getElementById('btnVerLista').addEventListener('click', abrirLista);
  document.getElementById('btnEnviarConsulta').addEventListener('click', () => enviarConsultaWhatsapp());
  document.getElementById('btnEnviarDesdeLista').addEventListener('click', () => enviarConsultaWhatsapp());

  document.getElementById('btnCompartir').addEventListener('click', () => {
    if(navigator.share) navigator.share({ title: document.title, url: location.href }).catch(()=>{});
    else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); alert('Enlace copiado al portapapeles.'); }
  });

  document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarModales(); });

  renderBarraConsulta();
  aplicarFiltros();
}

function aplicarFiltros(){
  let lista = CATALOGO.productos.slice();
  if(filtroEspecie) lista = lista.filter(p => String(p.especie_id||'') === filtroEspecie);
  if(filtroCategoria) lista = lista.filter(p => String(p.categoria_id||'') === filtroCategoria);
  if(filtroTexto){
    lista = lista.filter(p => [p.nombre, p.marca_nombre, p.sku].join(' ').toLowerCase().includes(filtroTexto));
  }

  const pEfectivo = p => (p.oferta && p.precio_oferta) ? p.precio_oferta : p.precio;

  if(ordenActual === 'precio_asc') lista.sort((a,b) => pEfectivo(a) - pEfectivo(b));
  else if(ordenActual === 'precio_desc') lista.sort((a,b) => pEfectivo(b) - pEfectivo(a));
  else if(ordenActual === 'mejor_valorados') lista.sort((a,b) => (b.estrella||0) - (a.estrella||0));
  else lista.sort((a,b) => (b.destacado ? 1 : 0) - (a.destacado ? 1 : 0));

  productosActuales = lista;
  document.getElementById('resultadoInfo').innerHTML = `
    <span>${lista.length} producto${lista.length === 1 ? '' : 's'}</span>
    ${(filtroTexto||filtroEspecie||filtroCategoria) ? '<button class="link-limpiar" onclick="limpiarFiltros()">Limpiar filtros</button>' : ''}`;
  renderGrid();
}

function limpiarFiltros(){
  filtroTexto = filtroEspecie = filtroCategoria = '';
  document.getElementById('buscador').value = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('activo', c.dataset.val === ''));
  aplicarFiltros();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if(!productosActuales.length){
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--carbon-60)">No hay productos que coincidan.</div>`;
    return;
  }
  grid.innerHTML = productosActuales.map(p => {
    const enLista = listaConsulta.has(p.producto_id);
    let precio = `$${monto(p.precio)}`;
    if(p.oferta && p.precio_oferta){
      precio = `$${monto(p.precio_oferta)} <span class="tachado">$${monto(p.precio)}</span>`;
    }
    return `
      <article class="card">
        <div class="card-badges">
          ${p.destacado ? '<span class="badge badge-destacado">★ Destacado</span>' : ''}
          ${p.oferta ? '<span class="badge badge-oferta">Oferta</span>' : ''}
        </div>
        <div onclick="abrirFicha('${escaparHTML(p.producto_id)}')" style="cursor:pointer">
          <div class="card-img">${imagenConFallback(p.imagen_url, p.nombre)}</div>
          <div class="card-marca">${escaparHTML(p.marca_nombre || '')}</div>
          <div class="card-nombre">${escaparHTML(p.nombre)}</div>
          ${p.estrella ? `<div class="card-estrellas">${estrellasTexto(p.estrella)}</div>` : ''}
          <div class="card-precio">${precio}</div>
        </div>
        <button class="card-btn-agregar ${enLista ? 'en-lista' : ''}" onclick="toggleConsulta('${escaparHTML(p.producto_id)}')">
          ${enLista ? '✓ En tu lista' : '+ Agregar a la lista'}
        </button>
      </article>`;
  }).join('');
}

function toggleConsulta(id){
  const p = CATALOGO.productos.find(x => x.producto_id === id);
  if(!p) return;
  if(listaConsulta.has(id)) listaConsulta.delete(id);
  else listaConsulta.set(id, p);
  
  guardarListaEnStorage();
  renderGrid();
  renderBarraConsulta();
  if(document.getElementById('overlayLista').classList.contains('abierto')) renderListaContenido();
}

function renderBarraConsulta(){
  const count = listaConsulta.size;
  document.getElementById('contadorConsulta').textContent = count;
  document.getElementById('barraConsulta').classList.toggle('visible', count > 0);
}

function abrirFicha(id){
  const p = CATALOGO.productos.find(x => x.producto_id === id);
  if(!p) return;
  const enLista = listaConsulta.has(id);
  const galeria = [p.imagen_url, ...(p.galeria_imagenes||[])].filter(Boolean);

  document.getElementById('fichaContenido').innerHTML = `
    ${galeria.length ? `<div class="ficha-galeria">${galeria.map(url => imagenConFallback(url, p.nombre)).join('')}</div>` : ''}
    <div class="ficha-marca">${escaparHTML(p.marca_nombre || '')}</div>
    <h2 class="ficha-nombre">${escaparHTML(p.nombre)}</h2>
    <div class="ficha-precio-fila">
      <span class="ficha-precio">$${monto(p.oferta && p.precio_oferta ? p.precio_oferta : p.precio)}</span>
      ${p.oferta && p.precio_oferta ? `<span class="ficha-precio tachado">$${monto(p.precio)}</span>` : ''}
    </div>
    ${p.descripcion ? `<div class="ficha-seccion"><h3>Descripción</h3><p>${escaparHTML(p.descripcion)}</p></div>` : ''}
    <div class="ficha-botones">
      <button class="btn btn-fantasma" onclick="toggleConsulta('${escaparHTML(id)}'); abrirFicha('${escaparHTML(id)}');">
        ${enLista ? '✓ En tu lista' : '+ Agregar a mi lista'}
      </button>
      <button class="btn btn-primario" onclick="enviarConsultaWhatsapp(['${escaparHTML(id)}'])">Consultar</button>
    </div>`;

  ultimoFoco = document.activeElement;
  alternarScrollBody(true);
  document.getElementById('overlayFicha').classList.add('abierto');
}

function abrirLista(){
  renderListaContenido();
  ultimoFoco = document.activeElement;
  alternarScrollBody(true);
  document.getElementById('overlayLista').classList.add('abierto');
}

function renderListaContenido(){
  const cont = document.getElementById('listaContenido');
  const items = Array.from(listaConsulta.values());
  if(!items.length){
    cont.innerHTML = '<div style="text-align:center;padding:20px;color:var(--carbon-60)">Tu lista está vacía.</div>';
    return;
  }
  cont.innerHTML = items.map(p => `
    <div class="lista-item">
      <div class="card-img">${imagenConFallback(p.imagen_url, p.nombre)}</div>
      <div class="lista-item-info">
        <div class="lista-item-nombre">${escaparHTML(p.nombre)}</div>
        <div class="lista-item-precio">$${monto(p.oferta && p.precio_oferta ? p.precio_oferta : p.precio)}</div>
      </div>
      <button class="lista-item-quitar" onclick="toggleConsulta('${escaparHTML(p.producto_id)}')">✕</button>
    </div>`).join('');
}

function cerrarModales(){
  document.querySelectorAll('.overlay').forEach(ov => ov.classList.remove('abierto'));
  alternarScrollBody(false);
  if(ultimoFoco) ultimoFoco.focus();
}

function enviarConsultaWhatsapp(idsForzados){
  let items = Array.from(listaConsulta.values());
  if(idsForzados){
    items = idsForzados.map(id => CATALOGO.productos.find(x => x.producto_id === id)).filter(Boolean);
  }
  if(!items.length) return;

  const num = String((CATALOGO.negocio && CATALOGO.negocio.whatsapp_numero) || '').replace(/[^\d]/g,'');
  const lineas = items.map(p => `- ${p.nombre} ${p.marca_nombre ? '('+p.marca_nombre+')' : ''}`);
  const texto = `Hola, quisiera consultar disponibilidad de:\n\n${lineas.join('\n')}\n\n¡Gracias!`;
  
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(texto)}`, '_blank');
}

iniciar();
</script>
</body>
</html>
